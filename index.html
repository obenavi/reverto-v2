<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reverto</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      background: var(--surface);
    }
    .logo-mark {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 8px 32px rgba(107,53,184,0.3);
    }
    .logo-name {
      font-size: 32px;
      font-weight: 800;
      color: var(--on-surface);
      letter-spacing: -1px;
      margin-bottom: 6px;
    }
    .logo-sub {
      font-size: 14px;
      color: var(--on-surface-3);
      margin-bottom: 48px;
      text-align: center;
    }
    .login-card {
      width: 100%;
      max-width: 360px;
      background: var(--surface-card);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      padding: 28px 24px;
    }
    .login-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 6px;
      color: var(--on-surface);
    }
    .login-desc {
      font-size: 13px;
      color: var(--on-surface-3);
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .input-wrap {
      position: relative;
      margin-bottom: 12px;
    }
    .input-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--on-surface-2);
      margin-bottom: 6px;
      display: block;
    }
    .error-msg {
      font-size: 13px;
      color: var(--error);
      text-align: center;
      margin-top: 12px;
      display: none;
    }
    .divider {
      text-align: center;
      font-size: 12px;
      color: var(--on-surface-3);
      margin: 16px 0;
    }
    .waitlist-link {
      font-size: 13px;
      color: var(--primary);
      text-align: center;
      cursor: pointer;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="logo-mark">
      <svg width="38" height="38" viewBox="0 0 38 38" fill="none">
        <path d="M8 10 L19 6 L30 10 L30 22 Q30 30 19 34 Q8 30 8 22 Z" fill="white" opacity="0.9"/>
        <path d="M14 18 L17 21 L24 14" stroke="rgba(107,53,184,0.9)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    </div>
    <div class="logo-name">Reverto</div>
    <div class="logo-sub">ניהול רכש חכם למסעדות</div>

    <div class="login-card">
      <!-- Tabs -->
      <div style="display:flex;gap:0;margin-bottom:20px;border-bottom:2px solid var(--border)">
        <button id="tab-password" onclick="switchTab('password')"
          style="flex:1;background:none;border:none;padding:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--primary);border-bottom:2px solid var(--primary);margin-bottom:-2px">
          מייל + סיסמה
        </button>
        <button id="tab-code" onclick="switchTab('code')"
          style="flex:1;background:none;border:none;padding:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--on-surface-3);border-bottom:2px solid transparent;margin-bottom:-2px">
          קוד גישה
        </button>
      </div>

      <!-- Email + Password tab -->
      <div id="panel-password">
        <label class="input-label">כתובת מייל</label>
        <input class="input mb-12" id="login-email" type="email" placeholder="email@example.com"
          onkeydown="if(event.key==='Enter')tryLoginPassword()">
        <label class="input-label">סיסמה</label>
        <input class="input" id="login-password" type="password" placeholder="הסיסמה שבחרת"
          onkeydown="if(event.key==='Enter')tryLoginPassword()">
        <button class="btn-primary mt-12" onclick="tryLoginPassword()" id="login-pwd-btn">כניסה</button>
        <div class="error-msg" id="error-pwd-msg">מייל או סיסמה שגויים</div>
        <div style="text-align:center;margin-top:12px">
          <span onclick="showForgotPassword()" style="font-size:12px;color:var(--on-surface-3);cursor:pointer;text-decoration:underline">שכחתי סיסמה</span>
        </div>
      </div>

      <!-- Code tab -->
      <div id="panel-code" style="display:none">
        <label class="input-label">קוד גישה אישי</label>
        <div style="display:flex;align-items:stretch;border:1.5px solid var(--border);border-radius:var(--radius-md);overflow:hidden;background:var(--surface-card);transition:border-color 0.15s" onfocusin="this.style.borderColor='var(--primary)'" onfocusout="this.style.borderColor='var(--border)'">
          <span style="background:var(--surface-low);padding:0 14px;display:flex;align-items:center;font-size:16px;font-weight:800;color:var(--primary);letter-spacing:1px;border-left:1.5px solid var(--border);flex-shrink:0">RV-</span>
          <input id="access-code" type="text" placeholder="XXXXXX" maxlength="6"
            style="flex:1;border:none;outline:none;padding:14px 12px;font-family:inherit;font-size:20px;font-weight:800;letter-spacing:5px;text-transform:uppercase;background:transparent;color:var(--on-surface);width:0"
            oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')"
            onkeydown="if(event.key==='Enter')tryLogin()">
        </div>
        <button class="btn-primary mt-12" onclick="tryLogin()" id="login-btn">כניסה</button>
        <div class="error-msg" id="error-msg">קוד גישה שגוי. נסה שוב.</div>
        <div style="text-align:center;margin-top:12px">
          <span onclick="showForgotCode()" style="font-size:12px;color:var(--on-surface-3);cursor:pointer;text-decoration:underline">שכחתי את הקוד האישי שלי</span>
        </div>
      </div>

      <div class="divider">— אין לך חשבון עדיין? —</div>
      <div class="waitlist-link" onclick="showWaitlist()">הצטרף לרשימת המתנה</div>
    </div>
  </div>

  <!-- Waitlist Modal -->
  <div id="waitlist-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;align-items:flex-end;justify-content:center">
    <div style="background:white;border-radius:24px 24px 0 0;padding:28px 24px 40px;width:100%;max-width:480px">
      <div style="font-size:18px;font-weight:800;margin-bottom:6px">רשימת המתנה</div>
      <div style="font-size:13px;color:var(--on-surface-3);margin-bottom:20px">נעדכן אותך ברגע שיהיה מקום</div>
      <label class="input-label">שם העסק</label>
      <input class="input mb-12" id="wl-name" type="text" placeholder="מסעדת הים">
      <label class="input-label">טלפון</label>
      <input class="input mb-16" id="wl-phone" type="tel" placeholder="050-0000000">
      <button class="btn-primary" onclick="submitWaitlist()">שלח בקשה</button>
      <button class="btn-ghost mt-8" onclick="hideWaitlist()">ביטול</button>
    </div>
  </div>

  <!-- Forgot Code Modal -->
  <div id="forgot-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;align-items:flex-end;justify-content:center">
    <div style="background:white;border-radius:24px 24px 0 0;padding:28px 24px 40px;width:100%;max-width:480px">
      <div style="font-size:18px;font-weight:800;margin-bottom:6px">שחזור קוד גישה</div>
      <div style="font-size:13px;color:var(--on-surface-3);margin-bottom:20px">הזן את המייל שרשמת בהצטרפות ונשלח לך את הקוד</div>
      <label class="input-label">כתובת מייל</label>
      <input class="input mb-16" id="forgot-email" type="email" placeholder="email@example.com">
      <div id="forgot-msg" style="display:none;font-size:13px;color:var(--success);text-align:center;margin-bottom:12px">אם קיים חשבון עם מייל זה — שלחנו את הקוד</div>
      <button class="btn-primary" onclick="submitForgotCode()">שלח לי את הקוד</button>
      <button class="btn-ghost mt-8" onclick="hideForgotCode()">ביטול</button>
    </div>
  </div>

  <script>
    async function tryLogin() {
      const suffix = document.getElementById('access-code').value.trim();
      if (!suffix) return;
      const code = 'RV-' + suffix;
      const btn = document.getElementById('login-btn');
      const err = document.getElementById('error-msg');
      btn.textContent = '...בודק';
      btn.disabled = true;
      err.style.display = 'none';
      try {
        const res = await fetch('/.netlify/functions/auth', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({code})
        });
        if (res.ok) {
          const data = await res.json();
          if (data.new_user_signup) {
            sessionStorage.setItem('rv_signup', JSON.stringify({
              new_user_signup: true,
              duration_months: data.duration_months,
              signup_code: data.signup_code
            }));
            window.location.href = '/onboarding.html';
          } else {
            ['rv_token','rv_jwt','rv_user'].forEach(k => localStorage.removeItem(k));
            const _s = (k,v) => { sessionStorage.setItem(k,v); localStorage.setItem(k,v); };
            _s('rv_token', data.user.personal_code || code);
            _s('rv_jwt', data.jwt);
            _s('rv_user', JSON.stringify(data.user));
            window.location.href = '/app.html';
          }
        } else {
          err.style.display = 'block';
          btn.textContent = 'כניסה';
          btn.disabled = false;
        }
      } catch(e) {
        err.textContent = 'שגיאת חיבור. בדוק אינטרנט.';
        err.style.display = 'block';
        btn.textContent = 'כניסה';
        btn.disabled = false;
      }
    }

    function switchTab(tab) {
      document.getElementById('panel-password').style.display = tab === 'password' ? 'block' : 'none';
      document.getElementById('panel-code').style.display = tab === 'code' ? 'block' : 'none';
      document.getElementById('tab-password').style.color = tab === 'password' ? 'var(--primary)' : 'var(--on-surface-3)';
      document.getElementById('tab-password').style.borderBottomColor = tab === 'password' ? 'var(--primary)' : 'transparent';
      document.getElementById('tab-code').style.color = tab === 'code' ? 'var(--primary)' : 'var(--on-surface-3)';
      document.getElementById('tab-code').style.borderBottomColor = tab === 'code' ? 'var(--primary)' : 'transparent';
    }

    async function tryLoginPassword() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      if (!email || !password) return;
      const btn = document.getElementById('login-pwd-btn');
      const err = document.getElementById('error-pwd-msg');
      btn.textContent = '...נכנס'; btn.disabled = true; err.style.display = 'none';
      try {
        const res = await fetch('/.netlify/functions/login-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
          const _s = (k,v) => { sessionStorage.setItem(k,v); localStorage.setItem(k,v); };
          _s('rv_token', email);
          _s('rv_jwt', data.jwt);
          _s('rv_user', JSON.stringify(data.user));
          window.location.href = '/app.html';
        } else {
          if (data.error === 'use_code') {
            err.textContent = 'משתמש זה נכנס עם קוד — עבור ל"קוד גישה"';
          } else {
            err.textContent = 'מייל או סיסמה שגויים';
          }
          err.style.display = 'block';
          btn.textContent = 'כניסה'; btn.disabled = false;
        }
      } catch(e) {
        err.textContent = 'שגיאת חיבור'; err.style.display = 'block';
        btn.textContent = 'כניסה'; btn.disabled = false;
      }
    }

    function showForgotPassword() {
      document.getElementById('forgot-modal').style.display = 'flex';
      document.getElementById('forgot-modal').querySelector('div:first-child div').textContent = 'שכחתי סיסמה';
    }

    function showForgotCode() {
      document.getElementById('forgot-modal').style.display = 'flex';
    }
    function hideForgotCode() {
      document.getElementById('forgot-modal').style.display = 'none';
      document.getElementById('forgot-msg').style.display = 'none';
      document.getElementById('forgot-email').value = '';
    }
    async function submitForgotCode() {
      const email = document.getElementById('forgot-email').value.trim();
      if (!email) return;
      await fetch('/.netlify/functions/forgot-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      document.getElementById('forgot-msg').style.display = 'block';
    }

    function showWaitlist() {
      document.getElementById('waitlist-modal').style.display = 'flex';
    }
    function hideWaitlist() {
      document.getElementById('waitlist-modal').style.display = 'none';
    }

    async function submitWaitlist() {
      const name = document.getElementById('wl-name').value.trim();
      const phone = document.getElementById('wl-phone').value.trim();
      if (!name || !phone) return;
      await fetch('/.netlify/functions/db-write', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ table: 'waitlist', action: 'insert', data: { business_name: name, phone } })
      });
      hideWaitlist();
      alert('תודה! נחזור אליך בקרוב.');
    }

    // Auto-redirect if already logged in with a valid (non-expired) JWT
    (function() {
      const jwt = sessionStorage.getItem('rv_jwt') || localStorage.getItem('rv_jwt');
      if (!jwt) return;
      try {
        const payload = JSON.parse(atob(jwt.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
        if (!payload.exp || payload.exp > Math.floor(Date.now() / 1000)) {
          window.location.href = '/app.html';
          return;
        }
      } catch {}
      // JWT exists but is expired — clear it so the login form shows clean
      ['rv_token','rv_jwt','rv_user','rv_profile'].forEach(k => {
        sessionStorage.removeItem(k); localStorage.removeItem(k);
      });
    })();
  </script>
</body>
</html>
