<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icon-192.png"><meta name="theme-color" content="#7c3aed">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reverto</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      background: var(--surface);
    }
    .logo-mark {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 8px 32px rgba(107,53,184,0.3);
    }
    .logo-name {
      font-size: 32px;
      font-weight: 800;
      color: var(--on-surface);
      letter-spacing: -1px;
      margin-bottom: 6px;
    }
    .logo-sub {
      font-size: 14px;
      color: var(--on-surface-3);
      margin-bottom: 48px;
      text-align: center;
    }
    .login-card {
      width: 100%;
      max-width: 360px;
      background: var(--surface-card);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      padding: 28px 24px;
    }
    .login-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 6px;
      color: var(--on-surface);
    }
    .login-desc {
      font-size: 13px;
      color: var(--on-surface-3);
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .input-wrap {
      position: relative;
      margin-bottom: 12px;
    }
    .input-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--on-surface-2);
      margin-bottom: 6px;
      display: block;
    }
    .error-msg {
      font-size: 13px;
      color: var(--error);
      text-align: center;
      margin-top: 12px;
      display: none;
    }
    .divider {
      text-align: center;
      font-size: 12px;
      color: var(--on-surface-3);
      margin: 16px 0;
    }
    .waitlist-link {
      font-size: 13px;
      color: var(--primary);
      text-align: center;
      cursor: pointer;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="logo-mark">
      <svg width="38" height="38" viewBox="0 0 38 38" fill="none">
        <path d="M8 10 L19 6 L30 10 L30 22 Q30 30 19 34 Q8 30 8 22 Z" fill="white" opacity="0.9"/>
        <path d="M14 18 L17 21 L24 14" stroke="rgba(107,53,184,0.9)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    </div>
    <div class="logo-name">Reverto</div>
    <div class="logo-sub">ניהול רכש חכם למסעדות</div>

    <div class="login-card">
      <!-- Tabs -->
      <div style="display:flex;gap:0;margin-bottom:20px;border-bottom:2px solid var(--border)">
        <button id="tab-password" onclick="switchTab('password')"
          style="flex:1;background:none;border:none;padding:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--primary);border-bottom:2px solid var(--primary);margin-bottom:-2px">
          מייל + סיסמה
        </button>
        <button id="tab-code" onclick="switchTab('code')"
          style="flex:1;background:none;border:none;padding:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--on-surface-3);border-bottom:2px solid transparent;margin-bottom:-2px">
          קוד גישה
        </button>
        <button id="tab-promo" onclick="switchTab('promo')"
          style="flex:1;background:none;border:none;padding:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--on-surface-3);border-bottom:2px solid transparent;margin-bottom:-2px">
          קוד הטבה
        </button>
      </div>

      <!-- Email + Password tab -->
      <div id="panel-password">
        <label class="input-label">כתובת מייל</label>
        <input class="input mb-12" id="login-email" type="email" placeholder="email@example.com"
          onkeydown="if(event.key==='Enter')tryLoginPassword()">
        <label class="input-label">סיסמה</label>
        <input class="input" id="login-password" type="password" placeholder="הסיסמה שבחרת"
          onkeydown="if(event.key==='Enter')tryLoginPassword()">
        <button class="btn-primary mt-12" onclick="tryLoginPassword()" id="login-pwd-btn">כניסה</button>
        <div class="error-msg" id="error-pwd-msg">מייל או סיסמה שגויים</div>
        <div style="text-align:center;margin-top:12px">
          <span onclick="showForgotPassword()" style="font-size:12px;color:var(--on-surface-3);cursor:pointer;text-decoration:underline">שכחתי סיסמה</span>
        </div>
      </div>

      <!-- Code tab -->
      <div id="panel-code" style="display:none">
        <label class="input-label">קוד גישה אישי</label>
        <div style="display:flex;align-items:stretch;border:1.5px solid var(--border);border-radius:var(--radius-md);overflow:hidden;background:var(--surface-card);transition:border-color 0.15s" onfocusin="this.style.borderColor='var(--primary)'" onfocusout="this.style.borderColor='var(--border)'">
          <span style="background:var(--surface-low);padding:0 14px;display:flex;align-items:center;font-size:16px;font-weight:800;color:var(--primary);letter-spacing:1px;border-left:1.5px solid var(--border);flex-shrink:0">RV-</span>
          <input id="access-code" type="text" placeholder="XXXXXX" maxlength="6"
            style="flex:1;border:none;outline:none;padding:14px 12px;font-family:inherit;font-size:20px;font-weight:800;letter-spacing:5px;text-transform:uppercase;background:transparent;color:var(--on-surface);width:0"
            oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')"
            onkeydown="if(event.key==='Enter')tryLogin()">
        </div>
        <button class="btn-primary mt-12" onclick="tryLogin()" id="login-btn">כניסה</button>
        <div class="error-msg" id="error-msg">קוד גישה שגוי. נסה שוב.</div>
        <div style="text-align:center;margin-top:12px">
          <span onclick="showForgotCode()" style="font-size:12px;color:var(--on-surface-3);cursor:pointer;text-decoration:underline">שכחתי את הקוד האישי שלי</span>
        </div>
      </div>

      <!-- Promo code tab -->
      <div id="panel-promo" style="display:none">
        <label class="input-label">קוד הטבה</label>
        <input class="input" id="promo-code" type="text" placeholder="הזן קוד הטבה"
          style="text-transform:uppercase;letter-spacing:2px;font-weight:700"
          oninput="this.value=this.value.toUpperCase().replace(/\s/g,'')"
          onkeydown="if(event.key==='Enter')tryLoginPromo()">
        <button class="btn-primary mt-12" onclick="tryLoginPromo()" id="promo-btn">המשך</button>
        <div class="error-msg" id="error-promo-msg">קוד לא נמצא. בדוק שוב.</div>
      </div>

      <div class="divider">— או —</div>
      <button id="google-signin-btn" onclick="handleGoogleSignIn()"
        style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border:1.5px solid var(--border);border-radius:var(--radius-xl);padding:13px;font-family:inherit;font-size:14px;font-weight:700;color:var(--on-surface);cursor:pointer;transition:background 0.15s">
        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
          <path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        כניסה עם Google
      </button>
    </div>
  </div>

  <!-- Waitlist Modal -->
  <div id="waitlist-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;align-items:flex-end;justify-content:center">
    <div style="background:white;border-radius:24px 24px 0 0;padding:28px 24px 40px;width:100%;max-width:480px">
      <div style="font-size:18px;font-weight:800;margin-bottom:6px">רשימת המתנה</div>
      <div style="font-size:13px;color:var(--on-surface-3);margin-bottom:20px">נעדכן אותך ברגע שיהיה מקום</div>
      <label class="input-label">שם העסק</label>
      <input class="input mb-12" id="wl-name" type="text" placeholder="מסעדת הים">
      <label class="input-label">טלפון</label>
      <input class="input mb-16" id="wl-phone" type="tel" placeholder="050-0000000">
      <button class="btn-primary" onclick="submitWaitlist()">שלח בקשה</button>
      <button class="btn-ghost mt-8" onclick="hideWaitlist()">ביטול</button>
    </div>
  </div>

  <!-- Forgot Code Modal -->
  <div id="forgot-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;align-items:flex-end;justify-content:center">
    <div style="background:white;border-radius:24px 24px 0 0;padding:28px 24px 40px;width:100%;max-width:480px">
      <div style="font-size:18px;font-weight:800;margin-bottom:6px">שחזור קוד גישה</div>
      <div style="font-size:13px;color:var(--on-surface-3);margin-bottom:20px">הזן את המייל שרשמת בהצטרפות ונשלח לך את הקוד</div>
      <label class="input-label">כתובת מייל</label>
      <input class="input mb-16" id="forgot-email" type="email" placeholder="email@example.com">
      <div id="forgot-msg" style="display:none;font-size:13px;color:var(--success);text-align:center;margin-bottom:12px">אם קיים חשבון עם מייל זה — שלחנו את הקוד</div>
      <button class="btn-primary" onclick="submitForgotCode()">שלח לי את הקוד</button>
      <button class="btn-ghost mt-8" onclick="hideForgotCode()">ביטול</button>
    </div>
  </div>

  <script>
    function goToApp() {
      const ret = sessionStorage.getItem('rv_return_url');
      if (ret) { sessionStorage.removeItem('rv_return_url'); window.location.href = ret; return; }
      goToApp();
    }

    async function tryLogin() {
      const suffix = document.getElementById('access-code').value.trim();
      if (!suffix) return;
      const code = 'RV-' + suffix;
      const btn = document.getElementById('login-btn');
      const err = document.getElementById('error-msg');
      btn.textContent = '...בודק';
      btn.disabled = true;
      err.style.display = 'none';
      try {
        const res = await fetch('/.netlify/functions/auth', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({code})
        });
        if (res.ok) {
          const data = await res.json();
          if (data.new_user_signup) {
            sessionStorage.setItem('rv_signup', JSON.stringify({
              new_user_signup: true,
              duration_months: data.duration_months,
              signup_code: data.signup_code
            }));
            window.location.href = '/onboarding.html';
          } else {
            ['rv_token','rv_jwt','rv_user'].forEach(k => localStorage.removeItem(k));
            const _s = (k,v) => { sessionStorage.setItem(k,v); localStorage.setItem(k,v); };
            _s('rv_token', data.user.personal_code || code);
            _s('rv_jwt', data.jwt);
            _s('rv_user', JSON.stringify(data.user));
            _s('rv_access_code', code);
            goToApp();
          }
        } else {
          err.style.display = 'block';
          btn.textContent = 'כניסה';
          btn.disabled = false;
        }
      } catch(e) {
        err.textContent = 'שגיאת חיבור. בדוק אינטרנט.';
        err.style.display = 'block';
        btn.textContent = 'כניסה';
        btn.disabled = false;
      }
    }

    function switchTab(tab) {
      ['password','code','promo'].forEach(t => {
        document.getElementById('panel-' + t).style.display = t === tab ? 'block' : 'none';
        document.getElementById('tab-' + t).style.color = t === tab ? 'var(--primary)' : 'var(--on-surface-3)';
        document.getElementById('tab-' + t).style.borderBottomColor = t === tab ? 'var(--primary)' : 'transparent';
      });
    }

    async function tryLoginPromo() {
      const raw = document.getElementById('promo-code').value.trim().toUpperCase();
      if (!raw) return;
      const btn = document.getElementById('promo-btn');
      const err = document.getElementById('error-promo-msg');
      btn.textContent = '...בודק';
      btn.disabled = true;
      err.style.display = 'none';
      try {
        const res = await fetch('/.netlify/functions/auth', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ code: raw })
        });
        if (!res.ok) {
          err.style.display = 'block';
          btn.textContent = 'המשך';
          btn.disabled = false;
          return;
        }
        const data = await res.json();
        if (data.new_user_signup) {
          // Generic promo code — go to full onboarding
          sessionStorage.setItem('rv_signup', JSON.stringify({
            new_user_signup: true,
            duration_months: data.duration_months,
            signup_code: data.signup_code
          }));
          localStorage.setItem('rv_signup', JSON.stringify({
            new_user_signup: true,
            duration_months: data.duration_months,
            signup_code: data.signup_code
          }));
          window.location.href = '/onboarding.html';
        } else {
          // Existing user (PILOT or personal code entered here)
          ['rv_token','rv_jwt','rv_user'].forEach(k => localStorage.removeItem(k));
          const _s = (k,v) => { sessionStorage.setItem(k,v); localStorage.setItem(k,v); };
          _s('rv_token', data.user.personal_code || raw);
          _s('rv_jwt', data.jwt);
          _s('rv_user', JSON.stringify(data.user));
          goToApp();
        }
      } catch(e) {
        err.textContent = 'שגיאת חיבור. בדוק אינטרנט.';
        err.style.display = 'block';
        btn.textContent = 'המשך';
        btn.disabled = false;
      }
    }

    async function tryLoginPassword() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      if (!email || !password) return;
      const btn = document.getElementById('login-pwd-btn');
      const err = document.getElementById('error-pwd-msg');
      btn.textContent = '...נכנס'; btn.disabled = true; err.style.display = 'none';
      try {
        const res = await fetch('/.netlify/functions/login-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
          const _s = (k,v) => { sessionStorage.setItem(k,v); localStorage.setItem(k,v); };
          _s('rv_token', email);
          _s('rv_jwt', data.jwt);
          _s('rv_user', JSON.stringify(data.user));
          goToApp();
        } else {
          if (data.error === 'use_code') {
            err.textContent = 'משתמש זה נכנס עם קוד — עבור ל"קוד גישה"';
          } else {
            err.textContent = 'מייל או סיסמה שגויים';
          }
          err.style.display = 'block';
          btn.textContent = 'כניסה'; btn.disabled = false;
        }
      } catch(e) {
        err.textContent = 'שגיאת חיבור'; err.style.display = 'block';
        btn.textContent = 'כניסה'; btn.disabled = false;
      }
    }

    function showForgotPassword() {
      document.getElementById('forgot-modal').style.display = 'flex';
      document.getElementById('forgot-modal').querySelector('div:first-child div').textContent = 'שכחתי סיסמה';
    }

    function showForgotCode() {
      document.getElementById('forgot-modal').style.display = 'flex';
    }
    function hideForgotCode() {
      document.getElementById('forgot-modal').style.display = 'none';
      document.getElementById('forgot-msg').style.display = 'none';
      document.getElementById('forgot-email').value = '';
    }
    async function submitForgotCode() {
      const email = document.getElementById('forgot-email').value.trim();
      if (!email) return;
      await fetch('/.netlify/functions/forgot-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      document.getElementById('forgot-msg').style.display = 'block';
    }

    function showWaitlist() {
      document.getElementById('waitlist-modal').style.display = 'flex';
    }
    function hideWaitlist() {
      document.getElementById('waitlist-modal').style.display = 'none';
    }

    async function submitWaitlist() {
      const name = document.getElementById('wl-name').value.trim();
      const phone = document.getElementById('wl-phone').value.trim();
      if (!name || !phone) return;
      await fetch('/.netlify/functions/db-write', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ table: 'waitlist', action: 'insert', data: { business_name: name, phone } })
      });
      hideWaitlist();
      alert('תודה! נחזור אליך בקרוב.');
    }

    // Auto-redirect if already logged in with a valid (non-expired) JWT
    (function() {
      const jwt = sessionStorage.getItem('rv_jwt') || localStorage.getItem('rv_jwt');
      if (!jwt) return;
      try {
        const payload = JSON.parse(atob(jwt.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
        if (!payload.exp || payload.exp > Math.floor(Date.now() / 1000)) {
          goToApp();
          return;
        }
      } catch {}
      // JWT exists but is expired — clear it so the login form shows clean
      ['rv_token','rv_jwt','rv_user','rv_profile'].forEach(k => {
        sessionStorage.removeItem(k); localStorage.removeItem(k);
      });
    })();

    // ── Google Sign-In ─────────────────────────────────────────
    let _googleClientIdPromise;
    function getGoogleClientId() {
      if (!_googleClientIdPromise) {
        _googleClientIdPromise = fetch('/.netlify/functions/google-config')
          .then(r => r.json()).then(d => d.clientId);
      }
      return _googleClientIdPromise;
    }

    async function handleGoogleSignIn() {
      if (typeof google === 'undefined') {
        alert('טוען... נסה שוב בעוד שנייה');
        return;
      }
      const clientId = await getGoogleClientId();
      google.accounts.id.initialize({
        client_id: clientId,
        callback: onGoogleCredential,
        ux_mode: 'popup'
      });
      google.accounts.id.prompt();
    }

    async function onGoogleCredential(response) {
      const btn = document.getElementById('google-signin-btn');
      btn.disabled = true;
      btn.style.opacity = '0.6';
      try {
        const res = await fetch('/.netlify/functions/google-signin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential: response.credential })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'שגיאה');

        const _s = (k,v) => { sessionStorage.setItem(k,v); localStorage.setItem(k,v); };
        _s('rv_jwt', data.jwt);
        _s('rv_token', data.user.personal_code || '');
        _s('rv_user', JSON.stringify(data.user));

        if (data.new_user || !data.user.onboarding_done) {
          window.location.href = '/onboarding.html';
        } else {
          goToApp();
        }
      } catch(e) {
        btn.disabled = false;
        btn.style.opacity = '1';
      }
    }
  </script>
</body>
</html>
