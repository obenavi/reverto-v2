<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>כספי הקואופרטיב</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=Rubik:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#F2F6F5; --surface:#FFFFFF; --surface-2:#F7FAF9; --ink:#13211E; --ink-2:#485753; --muted:#76837F;
  --line:#DCE4E1; --line-2:#EBF0EE; --accent:#0B6B63; --accent-ink:#FFFFFF; --accent-soft:#DDEFEC;
  --good:#1D7A3A; --good-soft:#E1F2E6; --bad:#BF3A31; --bad-soft:#FBE5E2; --warn:#9A6400; --warn-soft:#FBF0DA;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --grid:#E6ECEA;
  --display:"Rubik","Segoe UI","Arial Hebrew",Arial,sans-serif;
  --body:"IBM Plex Sans Hebrew","Segoe UI","Arial Hebrew",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1614; --surface:#15201E; --surface-2:#1A2725; --ink:#E6EEEC; --ink-2:#B2C0BC; --muted:#879591;
    --line:#2A3835; --line-2:#22302D; --accent:#4DB6AA; --accent-ink:#06201D; --accent-soft:#193531;
    --good:#5CC27A; --good-soft:#173524; --bad:#F07068; --bad-soft:#3A1D1B; --warn:#E3AA4C; --warn-soft:#3A2D14;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:#24322F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1614; --surface:#15201E; --surface-2:#1A2725; --ink:#E6EEEC; --ink-2:#B2C0BC; --muted:#879591;
  --line:#2A3835; --line-2:#22302D; --accent:#4DB6AA; --accent-ink:#06201D; --accent-soft:#193531;
  --good:#5CC27A; --good-soft:#173524; --bad:#F07068; --bad-soft:#3A1D1B; --warn:#E3AA4C; --warn-soft:#3A2D14;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:#24322F;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
.app{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:20px 60px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;font-weight:700}
h2{font-size:19px;font-weight:600}
h3{font-size:15px;font-weight:600}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
.small{font-size:13px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;gap:14px;align-items:center}
.mark{width:44px;height:44px;border-radius:12px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:26px;height:26px}
.brand p{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;padding-inline:8px}
.btn:disabled{opacity:.5;cursor:default}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding-block:10px;margin-bottom:6px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--ink-2);white-space:nowrap;position:relative}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.tab .badge{display:inline-block;min-width:18px;padding:0 5px;margin-inline-start:6px;border-radius:9px;background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:600;text-align:center}

.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 14px;margin-block:14px;font-size:14px}
.filters{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-block:14px}
.filters label{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--ink-2)}
select,input[type=text],input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:14px;max-width:100%}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.stack{display:flex;flex-direction:column;gap:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:12px}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .label{font-size:13px;color:var(--ink-2)}
.kpi .value{font-family:var(--display);font-size:24px;font-weight:600}
.kpi .sub{font-size:13px;color:var(--muted)}
.delta.good{color:var(--good)} .delta.bad{color:var(--bad)}

.chart-box{position:relative;height:300px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.legend i.line{height:3px;border-radius:2px;vertical-align:3px;width:14px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line-2);white-space:nowrap}
thead th{background:var(--surface-2);font-weight:600;color:var(--ink-2);font-size:13px;position:sticky;top:0}
td.n,th.n{text-align:left;font-variant-numeric:tabular-nums}
tr.sub td{font-weight:600;background:var(--surface-2)}
tr.total td{font-weight:700;border-top:2px solid var(--line)}
tr.pct td{color:var(--muted);font-size:13px;border-bottom-color:var(--line)}
td.first,th.first{position:sticky;right:0;background:var(--surface);z-index:1}
tr.sub td.first,tr.total td.first{background:var(--surface-2)}
thead th.first{background:var(--surface-2);z-index:2}
tbody tr:last-child td{border-bottom:0}

.pill{display:inline-flex;gap:5px;align-items:center;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.vbar{display:flex;width:120px;height:10px;align-items:center}
.vbar span{display:block;height:10px}
.vbar .half{flex:1;display:flex}
.vbar .half.l{justify-content:flex-end}
.vbar .axis{width:1px;height:14px;background:var(--muted)}

/* insights */
.insights{display:flex;flex-direction:column}
.insight{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.insight:last-child{border-bottom:0}
.insight .pill{grid-row:span 2;align-self:start;margin-top:2px}
.insight p{margin:0;color:var(--ink-2);font-size:14px}
.insight b{color:var(--ink);font-weight:600}

/* sources */
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{font-family:var(--display);font-size:17px;display:block;margin-bottom:4px}
.sources{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.src{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.src .row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-size:12px;padding:1px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.src dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:13px}
.src dt{color:var(--muted)} .src dd{margin:0}
.switch{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.switch input{accent-color:var(--accent);width:16px;height:16px}

.editor{border:1px solid var(--accent);border-radius:12px;background:var(--surface);padding:18px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 16px;margin-block:12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.field select,.field input{width:100%}
.hint{font-size:13px;color:var(--muted);margin:4px 0 0}

.budget-table input{width:88px;text-align:left;padding:4px 6px;font-variant-numeric:tabular-nums;direction:ltr}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:9px;font-size:14px;z-index:20;box-shadow:0 6px 20px rgb(0 0 0 / .2)}
details summary{cursor:pointer;color:var(--ink-2);font-size:14px}
@media (max-width:600px){.app{padding-inline:16px}h1{font-size:22px}.kpi .value{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" dir="rtl" lang="he">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M6 16V9"/><path d="M10 16V5"/><path d="M14 16v-5"/><path d="M18 16V7"/></svg>
      </div>
      <div>
        <h1>כספי הקואופרטיב</h1>
        <p>איחוד נתונים מכל המערכות · רווח והפסד · תקציב מול ביצוע</p>
      </div>

    <div class="actions">
      <button class="btn" id="btn-copy" type="button">העתקת הדוח</button>
      <button class="btn" id="btn-export" type="button">ייצוא לאקסל</button>
    </div>
  </header>

  <nav class="tabs" role="tablist" id="tabs"></nav>

  <div id="filters" class="filters"></div>
  <main id="view"></main>
</div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script>
'use strict';
/* ============================================================
   הגדרות: שורות דוח רווח והפסד
   contribution = השפעה על הרווח (+ הכנסה, − הוצאה)
   ============================================================ */
const LINES = [
  {id:'rev', name:'הכנסות',                     kind:'income',  budget:true},
  {id:'cos', name:'עלות השירות (חומרים וקבלני משנה)', kind:'expense', budget:true},
  {id:'pay', name:'שכר ונלוות',                 kind:'expense', budget:true},
  {id:'ops', name:'הוצאות תפעול (רכבים, שכירות)', kind:'expense', budget:true},
  {id:'adm', name:'הנהלה וכלליות',              kind:'expense', budget:true},
  {id:'fin', name:'מימון ועמלות',               kind:'expense', budget:true},
  {id:'oth', name:'הכנסות/הוצאות אחרות',        kind:'net',     budget:true},
  {id:'unk', name:'לא מסווג',                   kind:'net',     budget:false},
  {id:'ign', name:'לא לכלול בדוח (העברות, מע״מ)', kind:'none',  budget:false},
];
const LINE = Object.fromEntries(LINES.map(l=>[l.id,l]));
const PICKABLE = LINES.filter(l=>l.id!=='unk');

// מילות מפתח לסיווג אוטומטי. הסדר חשוב: הבדיקה נעצרת בהתאמה הראשונה.
const RULES = [
  ['ign', ['מע"מ','מע״מ','מעמ','העברה בין חשבונות','העברה לחשבון','פיקדון','vat','transfer']],
  ['pay', ['שכר','משכורת','ביטוח לאומי','פנסיה','קרן השתלמות','פיצויים','הבראה','עלות מעביד','salary','payroll','wage']],
  ['rev', ['הכנסה','הכנסות','מכירות','מכירה','תקבול מלקוח','revenue','sales','income']],
  ['cos', ['חומרי ניקוי','חומרי ניקיון','חומרים','קבלן משנה','קבלני משנה','ציוד ניקיון','ציוד ניקוי','materials','subcontract']],
  ['fin', ['עמלה','עמלות','ריבית','מימון','הפרשי שער','fee','interest']],
  ['ops', ['רכב','דלק','ליסינג','שכירות','שכ"ד','שכ״ד','חשמל','תיקון','תיקונים','אחזקה','מוסך','rent','fuel','vehicle','lease']],
  ['adm', ['משרד','הנהלה','רואה חשבון','רו"ח','רו״ח','עו"ד','עו״ד','ייעוץ','תוכנה','מנוי','טלפון','סלולר','פרסום','שיווק','ביטוח','אינטרנט','office','software','insurance']],
];
const TYPE_DEFAULT_LINE = {payroll:'pay', sales:'rev'};
const SOURCE_TYPES = {erp:'ERP / הנהלת חשבונות', bank:'בנק / אשראי', payroll:'שכר', sales:'CRM / מכירות', other:'אקסל / אחר'};
const FIELDS = [
  ['date','תאריך',['תאריך','date','ערך','חודש','month','period']],
  ['amount','סכום',['סכום','amount','total','סה"כ','סה״כ','עלות מעביד','עלות','ש"ח','₪']],
  ['debit','חובה',['חובה','debit','חיוב']],
  ['credit','זכות',['זכות','credit','זיכוי']],
  ['account','חשבון / סעיף',['כרטיס','חשבון','סעיף','קטגוריה','סוג הוצאה','סוג','account','category','מיון']],
  ['desc','תיאור',['פרטים','תיאור','description','memo','שם','ספק','לקוח']],
  ['dept','מחלקה / אתר',['מחלקה','אתר','פרויקט','מרכז רווח','מרכז עלות','department','cost center','site']],
];
const AMOUNT_MODES = {
  signed:'עמודת סכום: חיובי = הכנסה, שלילי = הוצאה',
  dc:'עמודות חובה/זכות (זכות = הכנסה)',
  expense:'עמודת סכום: כל השורות הוצאות',
  income:'עמודת סכום: כל השורות הכנסות',
};
const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const MSHORT = ['ינו׳','פבר׳','מרץ','אפר׳','מאי','יוני','יולי','אוג׳','ספט׳','אוק׳','נוב׳','דצמ׳'];
const NO_DEPT = 'ללא מחלקה';

/* ============================================================ state */
const STORE_KEY = 'coop-finance-v1';
let state = {sources:[], lineMap:{}, budget:{}, demo:false, ui:{tab:'dash', year:null, from:1, to:12, dept:''}};
let editor = null;       // מקור בעריכה
let txCache = null;
const charts = {};

function load(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw){ const s = JSON.parse(raw); state = Object.assign(state, s); state.ui = Object.assign({tab:'dash',year:null,from:1,to:12,dept:''}, s.ui||{}); return true; } }catch(e){}
  return false;
}
let saveWarned = false;
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch(e){ if(!saveWarned){ saveWarned = true; toast('הנתונים גדולים מדי לשמירה בדפדפן. הם יישארו זמינים עד רענון הדף.'); } }
}
function dirty(){ txCache = null; save(); }

/* ============================================================ utils */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const nf0 = new Intl.NumberFormat('he-IL',{maximumFractionDigits:0});
const nfc = new Intl.NumberFormat('he-IL',{notation:'compact',maximumFractionDigits:1});
// בטקסט עברי סימן המינוס "קופץ" לצד הלא נכון, ולכן כל מספר עטוף בבידוד LTR
const ltr = s => '\u2066' + s + '\u2069';
const moneyRaw = v => (v<0?'−':'') + '₪' + nf0.format(Math.abs(Math.round(v)));
const moneyCRaw = v => (v<0?'−':'') + '₪' + nfc.format(Math.abs(v));
const money = v => ltr(moneyRaw(v));
const moneyC = v => ltr(moneyCRaw(v));
const pct = (v,d=1) => isFinite(v) ? ltr((v<0?'−':'') + Math.abs(v*100).toFixed(d) + '%') : '—';
const ymKey = (y,m) => `${y}-${String(m).padStart(2,'0')}`;
const ymLabel = ym => MSHORT[+ym.slice(5)-1] + ' ' + ym.slice(2,4);
const norm = s => String(s??'').trim().toLowerCase().replace(/\s+/g,' ');
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3200); }

function parseNum(v){
  if(v==null || v==='') return null;
  if(typeof v==='number') return isFinite(v)?v:null;
  let s = String(v).trim(); if(!s) return null;
  let neg = false;
  if(/^\(.*\)$/.test(s)){ neg=true; s=s.slice(1,-1); }
  if(/-$/.test(s)){ neg=true; s=s.slice(0,-1); }
  s = s.replace(/[₪$€\s]|ש"ח|ש״ח|nis/gi,'').replace(/,/g,'');
  if(s.startsWith('−')) s='-'+s.slice(1);
  const n = parseFloat(s);
  if(!isFinite(n) || !/^-?[\d.]+$/.test(s)) return null;
  return neg ? -Math.abs(n) : n;
}
function parseDate(v){
  if(v==null || v==='') return null;
  if(v instanceof Date && !isNaN(v)) return [v.getFullYear(), v.getMonth()+1, v.getDate()];
  if(typeof v==='number'){
    if(v>20000 && v<80000){ const d = new Date(Math.round((v-25569)*864e5)); return [d.getUTCFullYear(), d.getUTCMonth()+1, d.getUTCDate()]; }
    return null;
  }
  const s = String(v).trim();
  let m;
  if((m = s.match(/^(\d{4})[-/.](\d{1,2})(?:[-/.](\d{1,2}))?/))) return [+m[1], +m[2], +(m[3]||1)];
  if((m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/))){ let y=+m[3]; if(y<100) y+=2000; return [y, +m[2], +m[1]]; }
  if((m = s.match(/^(\d{1,2})[-/.](\d{4})$/))) return [+m[2], +m[1], 1];
  return null;
}
function validDate(d){ return d && d[0]>1990 && d[0]<2100 && d[1]>=1 && d[1]<=12; }

/* ============================================================ קבצים */
async function readFile(file){
  const buf = await file.arrayBuffer();
  let wb;
  if(/\.(csv|txt|tsv)$/i.test(file.name)){
    let text;
    try{ text = new TextDecoder('utf-8',{fatal:true}).decode(buf); }
    catch(e){ text = new TextDecoder('windows-1255').decode(buf); } // ייצוא ישראלי ישן
    wb = XLSX.read(text.replace(/^\uFEFF/,''), {type:'string', raw:true}); // raw: לא לפרש 03/04 כתאריך אמריקאי
  } else {
    wb = XLSX.read(buf, {type:'array', cellDates:true});
  }
  const sheets = {};
  for(const name of wb.SheetNames){
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:'', blankrows:false});
    const ymd = c => { const x = new Date(c.getTime()+12*3600e3); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; };
    const clean = aoa.map(r=>r.map(c=> c instanceof Date ? ymd(c) : c))
                     .filter(r=>r.some(c=>String(c).trim()!==''));
    if(clean.length) sheets[name] = clean;
  }
  return sheets;
}
function detectHeader(aoa){
  const kw = FIELDS.flatMap(f=>f[2]);
  let best = 0, bestScore = -1;
  for(let i=0;i<Math.min(15,aoa.length);i++){
    const score = aoa[i].filter(c=>typeof c==='string' && kw.some(k=>norm(c).includes(k))).length;
    if(score>bestScore){ bestScore=score; best=i; }
  }
  return best;
}
function autoMap(headers){
  const map = {}; const used = new Set();
  for(const [key,,kws] of FIELDS){
    for(const k of kws){
      const i = headers.findIndex((h,idx)=>!used.has(idx) && norm(h).includes(k));
      if(i>=0){ map[key]=i; used.add(i); break; }
    }
  }
  return map;
}
function guessType(name, headers){
  const s = norm(name+' '+headers.join(' '));
  if(/שכר|payroll|עלות מעביד|ברוטו/.test(s)) return 'payroll';
  if(/בנק|bank|יתרה|אשראי|כרטיס אשראי/.test(s)) return 'bank';
  if(/crm|מכירות|sales|עסקאות|pipeline/.test(s)) return 'sales';
  if(/erp|הנהלת חשבונות|כרטסת|חובה|זכות|פקודות יומן|priority|פריוריטי|sap|חשבשבת/.test(s)) return 'erp';
  return 'other';
}

/* ============================================================ נרמול */
function normalizeSource(src){
  const out = []; const m = src.map; const rows = src.aoa.slice(src.headerRow+1);
  const get = (r,k) => m[k]==null ? '' : r[m[k]];
  let skipped = 0;
  for(const r of rows){
    const d = parseDate(get(r,'date'));
    let amt = null;
    if(src.amountMode==='dc'){
      const dr = parseNum(get(r,'debit'))||0, cr = parseNum(get(r,'credit'))||0;
      if(dr||cr) amt = cr - dr;
    } else {
      const a = parseNum(get(r,'amount'));
      if(a!=null) amt = src.amountMode==='expense' ? -Math.abs(a) : src.amountMode==='income' ? Math.abs(a) : a;
    }
    if(!validDate(d) || amt==null || amt===0){ skipped++; continue; }
    const account = String(get(r,'account')??'').trim();
    const desc = String(get(r,'desc')??'').trim();
    out.push({src:src.id, y:d[0], m:d[1], d:d[2], ym:ymKey(d[0],d[1]), amount:amt, account, desc,
              dept:String(get(r,'dept')??'').trim()||NO_DEPT, key:account||desc||src.name});
  }
  return {tx:out, skipped};
}
function guessLine(src, text){
  const s = norm(text);
  for(const [line, kws] of RULES) if(kws.some(k=>s.includes(k))) return line;
  return TYPE_DEFAULT_LINE[src.type] || 'unk';
}
const guessCache = new Map();
function lineOf(src, key){
  const mk = src.id+'::'+key;
  if(state.lineMap[mk]) return state.lineMap[mk];
  if(!guessCache.has(mk)) guessCache.set(mk, guessLine(src, key));
  return guessCache.get(mk);
}
function allTx(){
  if(txCache) return txCache;
  guessCache.clear();
  const list = [];
  for(const src of state.sources){
    const {tx, skipped} = normalizeSource(src);
    src._count = tx.length; src._skipped = skipped;
    src._range = tx.length ? [tx.reduce((a,t)=>t.ym<a?t.ym:a,'9999'), tx.reduce((a,t)=>t.ym>a?t.ym:a,'0000')] : null;
    for(const t of tx){ t.line = lineOf(src, t.key); t.inPnl = src.inPnl; list.push(t); }
  }
  txCache = list;
  return list;
}
const pnlTx = () => allTx().filter(t=>t.inPnl && t.line!=='ign');

/* ============================================================ חישובים */
function years(){
  const ys = new Set(pnlTx().map(t=>t.y));
  Object.keys(state.budget).forEach(y=>ys.add(+y));
  if(!ys.size) ys.add(new Date().getFullYear());
  return [...ys].sort((a,b)=>b-a);
}
function lastDataMonth(y){
  let m = 0; for(const t of pnlTx()) if(t.y===y && t.m>m) m=t.m;
  return m;
}
function range(){
  const {year,from,to} = state.ui; const ms=[];
  for(let m=from;m<=to;m++) ms.push(ymKey(year,m));
  return ms;
}
// מחזיר contribution לפי שורה × חודש
function compute(months, dept){
  const set = new Set(months);
  const res = {}; LINES.forEach(l=>res[l.id]=Object.fromEntries(months.map(m=>[m,0])));
  for(const t of pnlTx()){
    if(!set.has(t.ym)) continue;
    if(dept && t.dept!==dept) continue;
    res[t.line][t.ym] += t.amount;
  }
  return res;
}
const sum = o => Object.values(o).reduce((a,b)=>a+b,0);
function budgetContrib(line, ym){
  const b = state.budget[ym.slice(0,4)]; if(!b || !b[line]) return 0;
  const v = +b[line][+ym.slice(5)-1] || 0;
  return LINE[line].kind==='expense' ? -v : v;
}
function hasBudget(year){ const b=state.budget[year]; return !!b && Object.values(b).some(a=>a.some(v=>+v)); }
const disp = (line, c) => LINE[line].kind==='expense' ? -c : c;

// שורות הדוח כולל סיכומי ביניים
function pnlRows(res, months, withBudget){
  const val = (ids) => { const o={}; months.forEach(m=>o[m]=ids.reduce((a,id)=>a+res[id][m],0)); return o; };
  const bud = (ids) => months.reduce((a,m)=>a+ids.reduce((x,id)=>x+budgetContrib(id,m),0),0);
  const row = (id) => ({type:'line', id, name:LINE[id].name, vals:Object.fromEntries(months.map(m=>[m,disp(id,res[id][m])])),
                        total:disp(id,sum(res[id])), budget: withBudget && LINE[id].budget ? disp(id,bud([id])) : null, favor: sum(res[id]) - bud([id])});
  const subt = (name, ids, cls) => { const v=val(ids); const b=bud(ids); return {type:cls, name, vals:v, total:sum(v), budget: withBudget? b : null, favor: sum(v)-b}; };
  const rows = [];
  rows.push(row('rev'), row('cos'), row('pay'));
  const gp = subt('רווח גולמי', ['rev','cos','pay'], 'sub'); rows.push(gp);
  const rev = val(['rev']);
  rows.push({type:'pct', name:'שיעור רווח גולמי', vals:Object.fromEntries(months.map(m=>[m, rev[m]? gp.vals[m]/rev[m] : NaN])), total: sum(rev)? gp.total/sum(rev):NaN,
             budget: withBudget && bud(['rev']) ? gp.budget/bud(['rev']) : null});
  rows.push(row('ops'), row('adm'));
  rows.push(subt('רווח תפעולי', ['rev','cos','pay','ops','adm'], 'sub'));
  rows.push(row('fin'), row('oth'));
  if(Math.abs(sum(res.unk))>0.5) rows.push(row('unk'));
  rows.push(subt('רווח נקי', ['rev','cos','pay','ops','adm','fin','oth','unk'], 'total'));
  return rows;
}

}

/* ============================================================ סקירה */
function renderDash(v){
  const months = range(), dept = state.ui.dept;
  if(!pnlTx().length){ v.innerHTML = emptyState(); return; }
  const res = compute(months, dept);
  const withB = !dept && hasBudget(state.ui.year);
  const rows = pnlRows(res, months, withB);
  const R = n => rows.find(r=>r.name===n);
  const rev = sum(res.rev), gp = R('רווח גולמי'), net = R('רווח נקי'), pay = -sum(res.pay);
  const kpi = (label, value, sub) => `<div class="kpi"><span class="label">${label}</span><span class="value num">${value}</span><span class="sub">${sub||'&nbsp;'}</span></div>`;
  const vsB = (actual, budget, isCost) => {
    if(budget==null || !budget) return '';
    const d = actual-budget, good = isCost ? d<=0 : d>=0;
    return `<span class="delta ${good?'good':'bad'}">${d>=0?'▲':'▼'} <span class="num">${pct(Math.abs(d)/Math.abs(budget))}</span> ${d>=0?'מעל התקציב':'מתחת לתקציב'}</span>`;
  };
  const revRow = rows.find(r=>r.id==='rev'), payRow = rows.find(r=>r.id==='pay');
  v.innerHTML = `<div class="stack">
    <div class="kpis">
      ${kpi('הכנסות', moneyC(rev), vsB(rev, revRow.budget, false))}
      ${kpi('רווח גולמי', moneyC(gp.total), `שיעור <span class="num">${pct(rev?gp.total/rev:NaN)}</span>`)}
      ${kpi('שכר מתוך ההכנסות', pct(rev?pay/rev:NaN), vsB(pay, payRow.budget, true))}
      ${kpi('רווח נקי', moneyC(net.total), withB ? `תקציב <span class="num">${moneyC(net.budget)}</span>` : `שיעור <span class="num">${pct(rev?net.total/rev:NaN)}</span>`)}
    </div>
    <div class="grid2">
      <div class="stack">
      <section class="panel">
        <div class="panel-head"><h2>הכנסות, הוצאות ורווח לפי חודש</h2></div>
        <div class="legend"><span><i style="background:var(--s1)"></i>הכנסות</span><span><i style="background:var(--s2)"></i>סך הוצאות</span><span><i class="line" style="background:var(--s3)"></i>רווח נקי</span></div>
        <div class="chart-box"><canvas id="ch-main" aria-label="גרף הכנסות, הוצאות ורווח נקי לפי חודש"></canvas></div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>רווחיות לפי מחלקה</h2><span class="small muted">הכנסות והוצאות שסומנו במחלקה בקבצי המקור</span></div>
        ${deptTable(months)}
      </section>
      </div>
      <section class="panel">
        <div class="panel-head"><h2>תובנות</h2><span class="small muted">מחושב אוטומטית לתקופה שנבחרה</span></div>
        <div class="insights">${insights(months, dept, res, rows).map(i=>`<div class="insight"><span class="pill ${i.level}">${{good:'▲ חיובי',bad:'▼ דורש תשומת לב',warn:'● לבדיקה',info:'● מידע'}[i.level]}</span><h3>${i.title}</h3><p>${i.text}</p></div>`).join('')}</div>
      </section>
    </div>
  </div>`;
  const costs = months.map(m=>-(['cos','pay','ops','adm','fin'].reduce((a,id)=>a+res[id][m],0)+Math.min(0,res.oth[m]+res.unk[m])));
  const netM = months.map(m=>LINES.filter(l=>l.id!=='ign').reduce((a,l)=>a+res[l.id][m],0));
  drawChart('main', 'ch-main', {
    type:'bar',
    data:{labels:months.map(ymLabel), datasets:[
      {label:'הכנסות', data:months.map(m=>res.rev[m]), backgroundColor:cv('--s1'), borderRadius:4, maxBarThickness:22, order:2},
      {label:'סך הוצאות', data:costs, backgroundColor:cv('--s2'), borderRadius:4, maxBarThickness:22, order:2},
      {label:'רווח נקי', type:'line', data:netM, borderColor:cv('--s3'), backgroundColor:cv('--s3'), borderWidth:2, pointRadius:4, pointBorderColor:cv('--surface'), pointBorderWidth:2, tension:.25, order:1},
    ]}
  });
}
function deptTable(months){
  const set = new Set(months); const agg = {};
  for(const t of pnlTx()){
    if(!set.has(t.ym)) continue;
    const a = agg[t.dept] ||= {rev:0, pay:0, other:0};
    if(t.line==='rev') a.rev += t.amount; else if(t.line==='pay') a.pay -= t.amount; else a.other -= t.amount;
  }
  const list = Object.entries(agg).sort((a,b)=>b[1].rev-a[1].rev);
  if(list.length<2) return `<p class="muted small">לא נמצאה עמודת מחלקה בקבצים. כדי לקבל פילוח יש למפות עמודת "מחלקה / אתר" בלשונית מקורות נתונים.</p>`;
  return `<div class="tbl-wrap"><table><thead><tr><th class="first">מחלקה</th><th class="n">הכנסות</th><th class="n">שכר</th><th class="n">הוצאות אחרות</th><th class="n">תרומה</th><th class="n">שיעור תרומה</th><th class="n">שכר / הכנסות</th></tr></thead><tbody>
    ${list.map(([d,a])=>{ const c=a.rev-a.pay-a.other; const r=a.rev?c/a.rev:NaN; const pr=a.rev?a.pay/a.rev:NaN;
      return `<tr><td class="first">${esc(d)}</td><td class="n">${money(a.rev)}</td><td class="n">${money(a.pay)}</td><td class="n">${money(a.other)}</td><td class="n">${money(c)}</td>
      <td class="n">${a.rev?`<span class="pill ${r<0?'bad':r<0.1?'warn':'good'}"><span class="num">${pct(r)}</span></span>`:'<span class="muted">מרכז עלות</span>'}</td><td class="n">${pct(pr)}</td></tr>`;}).join('')}
  </tbody></table></div>`;
}

/* ============================================================ תובנות */
function insights(months, dept, res, rows){
  const out = []; const withB = !dept && hasBudget(state.ui.year);
  const data = months.filter(m=>LINES.some(l=>l.id!=='ign' && Math.abs(res[l.id][m])>0.5));
  const revM = m => res.rev[m];
  const netOf = m => LINES.filter(l=>l.id!=='ign').reduce((a,l)=>a+res[l.id][m],0);
  const netRow = rows.find(r=>r.name==='רווח נקי');

  // 1. רווח מול תקציב
  if(withB && netRow.budget!=null){
    const d = netRow.total - netRow.budget;
    out.push({level: d>=0?'good':'bad', title: d>=0?'הרווח הנקי מעל התקציב':'הרווח הנקי מתחת לתקציב',
      text:`בתקופה נרשם רווח נקי של <b class="num">${money(netRow.total)}</b> מול תקציב של <span class="num">${money(netRow.budget)}</span>: פער של <b class="num">${money(d)}</b>.`});
    // 2. הסעיפים שתרמו הכי הרבה לפער
    const lines = rows.filter(r=>r.type==='line' && r.budget!=null).sort((a,b)=>a.favor-b.favor);
    const worst = lines[0], best = lines[lines.length-1];
    if(worst && worst.favor < -1000) out.push({level:'bad', title:`החריגה הגדולה ביותר: ${worst.name}`,
      text:`${LINE[worst.id].kind==='income'?'ההכנסות נמוכות מהתקציב':'ההוצאה גבוהה מהתקציב'} ב-<b class="num">${money(Math.abs(worst.favor))}</b> (<span class="num">${pct(Math.abs(worst.favor)/Math.abs(worst.budget||1))}</span>). ${worstMonthText(worst.id, months)}`});
    if(best && best.favor > 1000) out.push({level:'good', title:`החיסכון/העודף הגדול ביותר: ${best.name}`,
      text:`טוב מהתקציב ב-<b class="num">${money(best.favor)}</b>.`});
  }
  // 3. יחס שכר להכנסות
  const pr = data.map(m=>({m, r: revM(m)? -res.pay[m]/revM(m) : NaN})).filter(x=>isFinite(x.r));
  if(pr.length){
    const avg = -sum(res.pay)/sum(res.rev); const top = pr.reduce((a,b)=>b.r>a.r?b:a);
    out.push({level: top.r>0.8?'bad':avg>0.72?'warn':'info', title:`השכר מהווה ${pct(avg,0)} מההכנסות`,
      text:`היחס הגבוה ביותר היה ב${MONTHS[+top.m.slice(5)-1]}: <b class="num">${pct(top.r)}</b>. ${top.r-avg>0.05?'ההכנסות ירדו באותו חודש יותר מהשכר, ולכן כדאי לבדוק התאמה של כוח האדם להיקף העבודה.':''}`});
  }
  // 4. מגמת הכנסות
  if(data.length>=2){
    const last = data[data.length-1], prev = data[data.length-2];
    const ch = revM(prev)? (revM(last)-revM(prev))/revM(prev) : NaN;
    if(isFinite(ch) && Math.abs(ch)>0.03) out.push({level: ch>0?'good':'warn', title:`ההכנסות ב${MONTHS[+last.slice(5)-1]} ${ch>0?'עלו':'ירדו'} ב-${pct(Math.abs(ch),0)}`,
      text:`<span class="num">${money(revM(last))}</span> לעומת <span class="num">${money(revM(prev))}</span> בחודש הקודם.`});
  }
  // 5. קפיצה חריגה בסעיף הוצאה
  if(data.length>=3){
    const last = data[data.length-1], prevs = data.slice(0,-1);
    let spike=null;
    for(const id of ['cos','ops','adm','fin']){
      const avg = -prevs.reduce((a,m)=>a+res[id][m],0)/prevs.length, cur = -res[id][last];
      if(avg>1000 && cur>avg*1.15 && (!spike || cur-avg>spike.diff)) spike={id,cur,avg,diff:cur-avg};
    }
    if(spike) out.push({level:'warn', title:`קפיצה ב${LINE[spike.id].name}`,
      text:`ב${MONTHS[+last.slice(5)-1]} נרשמו <b class="num">${money(spike.cur)}</b>, <span class="num">${pct(spike.cur/spike.avg-1,0)}</span> מעל הממוצע החודשי בתקופה (<span class="num">${money(spike.avg)}</span>).`});
  }
  // 6. מחלקה עם התרומה הנמוכה
  if(!dept){
    const set=new Set(months), agg={};
    for(const t of pnlTx()){ if(!set.has(t.ym)||t.dept===NO_DEPT) continue; const a=agg[t.dept] ||= {rev:0,net:0}; if(t.line==='rev') a.rev+=t.amount; a.net+=t.amount; }
    const ranked = Object.entries(agg).filter(([,a])=>a.rev>0).map(([d,a])=>({d, r:a.net/a.rev})).sort((a,b)=>a.r-b.r);
    if(ranked.length>=2) out.push({level: ranked[0].r<0.05?'warn':'info', title:`שיעור התרומה הנמוך ביותר: ${esc(ranked[0].d)}`,
      text:`<b class="num">${pct(ranked[0].r)}</b> לעומת <span class="num">${pct(ranked[ranked.length-1].r)}</span> ב${esc(ranked[ranked.length-1].d)}.`});
  }
  // 7. תחזית לסוף שנה
  if(!dept && hasBudget(state.ui.year)){
    const y = state.ui.year, lm = lastDataMonth(y);
    if(lm && lm<12){
      const ms = Array.from({length:lm},(_,i)=>ymKey(y,i+1)); const r = compute(ms,'');
      const net = m => LINES.filter(l=>l.id!=='ign').reduce((a,l)=>a+r[l.id][m],0);
      const ytd = ms.reduce((a,m)=>a+net(m),0);
      const last3 = ms.slice(-3); const rate = last3.reduce((a,m)=>a+net(m),0)/last3.length;
      const fc = ytd + rate*(12-lm);
      const bud = Array.from({length:12},(_,i)=>ymKey(y,i+1)).reduce((a,m)=>a+['rev','cos','pay','ops','adm','fin','oth'].reduce((x,id)=>x+budgetContrib(id,m),0),0);
      out.push({level: fc>=bud?'good':'warn', title:'תחזית רווח לסוף השנה',
        text:`לפי קצב שלושת החודשים האחרונים, הרווח הנקי השנתי צפוי להגיע ל-<b class="num">${money(fc)}</b> מול תקציב שנתי של <span class="num">${money(bud)}</span>.`});
    }
  }
  // 8. איכות נתונים
  const unk = pnlTx().filter(t=>t.line==='unk' && new Set(months).has(t.ym));
  if(unk.length) out.push({level:'warn', title:`${unk.length} תנועות לא מסווגות`,
    text:`בסך <b class="num">${money(unk.reduce((a,t)=>a+t.amount,0))}</b>. אפשר לשייך אותן לסעיפים בלשונית "מיפוי סעיפים".`});
  const dups = findDuplicates();
  if(dups.length) out.push({level:'warn', title:`${dups.length} תנועות שנראות כפולות בין מערכות`,
    text:`אותו סכום הופיע בשני מקורות שנכללים בדוח, בהפרש של עד 3 ימים (סה״כ <span class="num">${money(dups.reduce((a,p)=>a+Math.abs(p[0].amount),0))}</span>). הפירוט בלשונית "מקורות נתונים".`});
  if(!out.length) out.push({level:'info', title:'אין מספיק נתונים לתובנות', text:'כדאי להרחיב את טווח החודשים או להזין תקציב.'});
  return out;
}
function worstMonthText(id, months){
  let w=null; for(const m of months){ const f = compute([m],'')[id][m] - budgetContrib(id,m); if(!w||f<w.f) w={m,f}; }
  return w && w.f<0 ? `הפער הגדול ביותר נרשם ב${MONTHS[+w.m.slice(5)-1]}.` : '';
}
function findDuplicates(){
  const tx = pnlTx(); const by = new Map(); const pairs=[];
  for(const t of tx){ const k=Math.round(Math.abs(t.amount)*100); if(Math.abs(t.amount)<200) continue; (by.get(k)||by.set(k,[]).get(k)).push(t); }
  for(const list of by.values()){
    if(list.length<2) continue;
    for(let i=0;i<list.length;i++) for(let j=i+1;j<list.length;j++){
      const a=list[i], b=list[j]; if(a.src===b.src || Math.sign(a.amount)!==Math.sign(b.amount)) continue;
      const da=Date.UTC(a.y,a.m-1,a.d), db=Date.UTC(b.y,b.m-1,b.d);
      if(Math.abs(da-db)<=3*864e5) pairs.push([a,b]);
    }
  }
  return pairs;
}

          <td class="n">${money(r.total-r.budget)}</td><td class="n">${r.budget?pct((r.total-r.budget)/Math.abs(r.budget)):'—'}</td><td>${bar(r.favor)}</td><td>${status(r)}</td></tr>`).join('')}</tbody>
      </table></div>

      <div class="legend"><span><i style="background:var(--s1)"></i>ביצוע</span><span><i class="line" style="background:var(--muted)"></i>תקציב</span></div>
      <div class="chart-box"><canvas id="ch-bva" aria-label="רווח נקי חודשי מול תקציב"></canvas></div>

        <td class="n" data-tot="${l.id}">${money(tot(l.id))}</td><td><button class="btn ghost small" type="button" data-fill="${l.id}" title="העתקת ינואר לכל החודשים">מילוי שנתי</button></td></tr>`).join('')}
      </tbody></table></div>

}
function monthFromHeader(h){
  if(h==null || h==='') return null;
  const s = norm(h);
  const i = MONTHS.findIndex(n=>s.startsWith(n.slice(0,3)));
  if(i>=0) return i+1;
  const en = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].findIndex(n=>s.startsWith(n));
  if(en>=0) return en+1;
  const d = parseDate(h); if(validDate(d)) return d[1];
  if(/^\d{1,2}$/.test(s) && +s>=1 && +s<=12) return +s;
  return null;
}
async function importBudget(file){
  const sheets = await readFile(file); const aoa = Object.values(sheets)[0]||[];
  let hr=-1, cols=null;
  for(let i=0;i<Math.min(15,aoa.length);i++){
    const c = aoa[i].map(monthFromHeader); if(c.filter(Boolean).length>=3){ hr=i; cols=c; break; }
  }
  if(hr<0){ toast('לא נמצאה שורת כותרות עם חודשים בקובץ התקציב'); return; }
  const y = String(state.ui.year); const b = {}; let matched=0, unmatched=[];
  const nameCol = aoa[hr].findIndex((_,i)=>!cols[i]);
  for(const r of aoa.slice(hr+1)){
    const name = String(r[nameCol]??'').trim(); if(!name) continue;
    if(/סה"כ|סה״כ|רווח|total/i.test(name)) continue;
    const exact = LINES.find(l=>norm(l.name)===norm(name)) || LINES.filter(l=>norm(name).startsWith(norm(l.name).split(' (')[0])).sort((a,b)=>b.name.length-a.name.length)[0];
    const line = exact ? exact.id : guessLine({type:'other'}, name);
    if(!LINE[line].budget){ unmatched.push(name); continue; }
    b[line] ||= Array(12).fill(0);
    cols.forEach((m,i)=>{ if(m){ const n=parseNum(r[i]); if(n) b[line][m-1]+=Math.abs(n); } });
    matched++;
  }
  state.budget[y] = b; dirty(); render();
  toast(`יובאו ${matched} שורות תקציב${unmatched.length?`. לא זוהו: ${unmatched.slice(0,3).join(', ')}`:''}`);
}

function reportAoa(){
  const months = range(), dept = state.ui.dept, withB = !dept && hasBudget(state.ui.year);
  const rows = pnlRows(compute(months, dept), months, withB);
  const head = ['סעיף', ...months.map(ymLabel), 'סה"כ', ...(withB?['תקציב','סטייה']:[])];
  const r2 = r => r.type==='pct' ? v=> isFinite(v)&&v!=null? Math.round(v*1000)/10+'%' : '' : v=> v==null?'':Math.round(v);
  return [head, ...rows.map(r=>{ const f=r2(r); return [r.name, ...months.map(m=>f(r.vals[m])), f(r.total), ...(withB?[f(r.budget), r.type==='pct'?'':Math.round(r.favor)]:[])]; })];
}

    erp.push([d(m,1),ref++,'שכירות משרד ומחסן','שכ"ד משרדי הקואופרטיב','מטה',18500,'']);
    erp.push([d(m,5),ref++,'ביטוח עסק','ביטוח צד ג׳ וחבות מעבידים','מטה',4200,'']);
    erp.push([d(m,7),ref++,'תוכנה ומנויים','מערכת שיבוץ משמרות + הנהלת חשבונות','מטה',jit(2900,0.05),'']);
    erp.push([d(m,9),ref++,'טלפון וסלולר','קווים לצוותי שטח','מטה',jit(2400,0.06),'']);

    if(m%3===0) erp.push([d(m,25),ref++,'שירותי רואה חשבון','ריטיינר רבעוני','מטה',6500,'']);
    erp.push([d(m,28),ref++,'עמלות בנק','עמלות ניהול חשבון','מטה',jit(520,0.15),'']);

document.addEventListener('dragover', e=>{ const d=e.target.closest?.('#drop'); if(d){ e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e=>{ const d=e.target.closest?.('#drop'); if(d) d.classList.remove('over'); });
document.addEventListener('drop', e=>{ const d=e.target.closest?.('#drop'); if(d){ e.preventDefault(); d.classList.remove('over'); handleFiles([...e.dataTransfer.files]); } });
// ציור מחדש של הגרפים כשערכת הצבעים משתנה
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', ()=>render());
new MutationObserver(()=>render()).observe(document.documentElement,{attributes:true, attributeFilter:['data-theme']});

/* ============================================================ הפעלה */
if(!window.XLSX || !window.Chart) document.getElementById('view').innerHTML = '<div class="panel empty">לא הצלחנו לטעון את רכיבי הקריאה והגרפים. יש לבדוק את החיבור לאינטרנט ולרענן.</div>';
if(!load() || !state.sources.length) demoData();
render();
</script>
