<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=Rubik:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#F2F6F5; --surface:#FFFFFF; --surface-2:#F7FAF9; --ink:#13211E; --ink-2:#485753; --muted:#6F7C78;
  --line:#DCE4E1; --line-2:#EBF0EE; --accent:#0B6B63; --accent-ink:#FFFFFF; --accent-soft:#DDEFEC;
  --good:#1D7A3A; --good-soft:#E1F2E6; --bad:#BF3A31; --bad-soft:#FBE5E2; --warn:#8F5D00; --warn-soft:#FBF0DA;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --grid:#E6ECEA;
  --display:"Rubik","Segoe UI","Arial Hebrew",Arial,sans-serif;
  --body:"IBM Plex Sans Hebrew","Segoe UI","Arial Hebrew",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1614; --surface:#15201E; --surface-2:#1A2725; --ink:#E6EEEC; --ink-2:#B2C0BC; --muted:#8B9995;
    --line:#2A3835; --line-2:#22302D; --accent:#4DB6AA; --accent-ink:#06201D; --accent-soft:#193531;
    --good:#5CC27A; --good-soft:#173524; --bad:#F07068; --bad-soft:#3A1D1B; --warn:#E3AA4C; --warn-soft:#3A2D14;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:#24322F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1614; --surface:#15201E; --surface-2:#1A2725; --ink:#E6EEEC; --ink-2:#B2C0BC; --muted:#8B9995;
  --line:#2A3835; --line-2:#22302D; --accent:#4DB6AA; --accent-ink:#06201D; --accent-soft:#193531;
  --good:#5CC27A; --good-soft:#173524; --bad:#F07068; --bad-soft:#3A1D1B; --warn:#E3AA4C; --warn-soft:#3A2D14;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:#24322F;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
.app{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:20px 60px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;font-weight:700}
h2{font-size:19px;font-weight:600}
h3{font-size:15px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
p{margin:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;gap:14px;align-items:center}
.mark{width:44px;height:44px;border-radius:12px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:26px;height:26px}
.brand p{margin-top:2px;color:var(--ink-2);font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:3px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.store-note{font-size:12px;color:var(--muted)}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding-block:10px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--ink-2);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.tab .badge{display:inline-block;min-width:18px;padding:0 5px;margin-inline-start:6px;border-radius:9px;background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:600;text-align:center}

.filters{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-block:16px}
.filters label{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--ink-2)}
select,input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:14px;max-width:100%}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.stack{display:flex;flex-direction:column;gap:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel-head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between;margin-bottom:12px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .label{font-size:13px;color:var(--ink-2)}
.kpi .value{font-family:var(--display);font-size:24px;font-weight:600}
.kpi .sub{font-size:13px;color:var(--muted)}
.delta.good{color:var(--good)} .delta.bad{color:var(--bad)}

.chart-box{position:relative;height:280px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.legend i.line{height:3px;border-radius:2px;vertical-align:3px;width:14px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line-2);white-space:nowrap}
thead th{background:var(--surface-2);font-weight:600;color:var(--ink-2);font-size:13px}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
th .arrow{font-size:10px;margin-inline-start:4px}
td.n,th.n{text-align:left;font-variant-numeric:tabular-nums}
td.first,th.first{position:sticky;right:0;background:var(--surface);z-index:1}
thead th.first{background:var(--surface-2);z-index:2}
tr.total td{font-weight:700;background:var(--surface-2);border-top:2px solid var(--line)}
tr.total td.first{background:var(--surface-2)}
tr.sub td{font-weight:600;background:var(--surface-2)}
tr.sub td.first{background:var(--surface-2)}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--surface-2)}
tr.detail td{background:var(--surface-2);white-space:normal;padding:10px 14px}
tbody tr:last-child td{border-bottom:0}
.wrap{white-space:normal;min-width:180px}

.pill{display:inline-flex;gap:5px;align-items:center;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pills{display:flex;flex-wrap:wrap;gap:4px}

.insights{display:flex;flex-direction:column}
.insight{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.insight:last-child{border-bottom:0}
.insight .pill{grid-row:span 2;align-self:start;margin-top:2px}
.insight p{color:var(--ink-2);font-size:14px}
.insight b{color:var(--ink);font-weight:600}

.drop{border:2px dashed var(--line);border-radius:12px;padding:24px;text-align:center;background:var(--surface);cursor:pointer;display:block}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{font-family:var(--display);font-size:17px;display:block;margin-bottom:4px}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.month-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.slot{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding-top:8px;border-top:1px solid var(--line-2)}
.slot .pill{grid-row:span 2;align-self:start}
.checks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--ink-2)}
.checks li::before{content:"✓ ";color:var(--good);font-weight:700}
.checks li.warn::before{content:"! ";color:var(--warn)}
.checks li.bad::before{content:"✕ ";color:var(--bad)}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 4px 2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);margin:2px}
.chip button{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:0 4px;font-size:14px;line-height:1}
.chip button:hover{color:var(--bad)}
.queue-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2)}
.queue-row:last-child{border-bottom:0}
.hint{font-size:13px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:9px;font-size:14px;z-index:20;box-shadow:0 6px 20px rgb(0 0 0 / .2);max-width:calc(100% - 32px)}
@media (max-width:600px){.app{padding-inline:16px}h1{font-size:22px}.kpi .value{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="app" dir="rtl" lang="he">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M6 16V9"/><path d="M10 16V5"/><path d="M14 16v-5"/><path d="M18 16V7"/></svg>
      </div>
      <div>
        <h1>כספי הקואופרטיב</h1>
        <p>רווחיות לפי לקוח וסניף: הנהלת חשבונות · TimeWatch · שכר</p>
      </div>
    </div>
    <div class="actions">
      <span class="store-note" id="store-note"></span>
      <button class="btn" id="btn-export" type="button">ייצוא לאקסל</button>
    </div>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div id="filters" class="filters"></div>
  <main id="view"><div class="panel empty">טוען נתונים…</div></main>
</div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script>
'use strict';
/* ============================================================
   מודל הנתונים
   mapping: { groups:[{id,name,sites:[code],clients:[name]}], overheadSites:[code] }
     קבוצה = לקוח עסקי אחד: אתרים ב-TimeWatch/שכר (לפי קוד) + שמות בהנהלת החשבונות.
   months/<YYYY-MM>: { revenue, hours, payroll } — סיכומים בלבד, בלי פירוט עובדים.
   ============================================================ */
const REV_H = [60, 90];     // הכנסה לשעה מחוץ לטווח = חשד להתאמה שגויה
const COST_H_HIGH = 85;     // עלות מעביד לשעה חריגה
const LOW_MARGIN = 0.10;
const NO_BRANCH = 'ללא סניף';
const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const monthName = ym => `${MONTHS[+ym.slice(5)-1]} ${ym.slice(0,4)}`;

let mapping = {groups:[], overheadSites:[]};
let months = {};                 // ym -> doc
let ui = {tab:'overview', ym:null, pmode:'month', branch:'', q:'', sort:['gp','asc'], open:null, client:null};
try{ Object.assign(ui, JSON.parse(localStorage.getItem('coop-ui')||'{}')); }catch(e){}
const saveUi = () => { try{ localStorage.setItem('coop-ui', JSON.stringify({tab:ui.tab, ym:ui.ym, pmode:ui.pmode, branch:ui.branch, sort:ui.sort, client:ui.client})); }catch(e){} };
const charts = {};

/* ============================================================ utils */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf0 = new Intl.NumberFormat('he-IL',{maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat('he-IL',{minimumFractionDigits:1,maximumFractionDigits:1});
const nfc = new Intl.NumberFormat('he-IL',{notation:'compact',maximumSignificantDigits:3});
// בטקסט עברי המינוס "קופץ" לצד הלא נכון, לכן כל מספר עטוף בבידוד LTR
const ltr = s => '⁦' + s + '⁩';
const moneyRaw = v => (v<-0.5?'−':'') + '₪' + nf0.format(Math.abs(Math.round(v)));
const money = v => ltr(moneyRaw(v));
const moneyC = v => ltr((v<0?'−':'') + '₪' + nfc.format(Math.abs(v)));
const perH = v => isFinite(v) ? ltr('₪' + nf1.format(v)) : '—';
const pct = (v,d=1) => isFinite(v) ? ltr((v<0?'−':'') + Math.abs(v*100).toFixed(d) + '%') : '—';
const hrs = v => ltr(nf0.format(Math.round(v)));
const normName = s => String(s??'').replace(/[״“”]/g,'"').replace(/[׳‘’`]/g,"'").replace(/\s+/g,' ').trim();
const num = v => { if(typeof v==='number') return isFinite(v)?v:null; const s=String(v??'').replace(/[,\s₪]/g,''); if(!/^-?\d+(\.\d+)?$/.test(s)) return null; return +s; };
const ymOf = (y,m) => `${y}-${String(m).padStart(2,'0')}`;
function dateYm(v){
  if(v instanceof Date && !isNaN(v)){ const x=new Date(v.getTime()+12*3600e3); return ymOf(x.getFullYear(), x.getMonth()+1); }
  const s = String(v??'').trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-\d{1,2}/))) return ymOf(m[1],m[2]);
  if((m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/))) return ymOf(m[3],m[2]);
  return null;
}
const majority = arr => { const c={}; arr.filter(Boolean).forEach(x=>c[x]=(c[x]||0)+1); return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||null; };
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,4000); }

/* ============================================================ אחסון
   בעמוד שפורסם: מאגר משותף (db). בפתיחה מקומית של הקובץ: אחסון הדפדפן. */
const store = {
  db:null, mode:'local',
  async init(){
    if(window.claude?.use){ try{ this.db = await window.claude.use('db'); }catch(e){ this.db=null; } }
    this.mode = this.db ? 'db' : 'local';
    if(this.db){
      this.db.doc('settings/mapping').onSnapshot(s=>{ if(s.exists){ mapping = normalizeMapping(s.data()); render(); } }, e=>this.fail(e));
      this.db.collection('months').onSnapshot(q=>{ const m={}; q.docs.forEach(d=>m[d.id]=d.data()); months=m; render(); }, e=>this.fail(e));
    } else {
      try{ mapping = normalizeMapping(JSON.parse(localStorage.getItem('coop-mapping')||'null')||{}); months = JSON.parse(localStorage.getItem('coop-months')||'{}'); }catch(e){}
    }
  },
  fail(e){ if(e?.code!=='revoked') toast('החיבור לנתונים המשותפים נכשל. יש לרענן את הדף.'); },
  async saveMapping(){
    mapping.updatedAt = new Date().toISOString();
    if(this.db) await this.db.doc('settings/mapping').set(JSON.parse(JSON.stringify(mapping)));
    else try{ localStorage.setItem('coop-mapping', JSON.stringify(mapping)); }catch(e){ toast('השמירה בדפדפן נכשלה'); }
  },
  async saveMonth(ym, doc){
    months[ym] = doc;
    if(this.db) await this.db.doc('months/'+ym).set(JSON.parse(JSON.stringify(doc)));
    else try{ localStorage.setItem('coop-months', JSON.stringify(months)); }catch(e){ toast('השמירה בדפדפן נכשלה'); }
  },
  async deleteMonth(ym){
    delete months[ym];
    if(this.db) await this.db.doc('months/'+ym).delete();
    else try{ localStorage.setItem('coop-months', JSON.stringify(months)); }catch(e){}
  },
};
function normalizeMapping(m){
  return {
    groups:(m.groups||[]).map(g=>({id:g.id, name:g.name, sites:(g.sites||[]).map(String), clients:(g.clients||[]).map(normName)})),
    overheadSites:(m.overheadSites||['999']).map(String), updatedAt:m.updatedAt||null,
  };
}

/* ============================================================ קריאת קבצים */
async function readWorkbook(file){
  const buf = await file.arrayBuffer();
  const head = new TextDecoder('utf-8').decode(buf.slice(0,2048)).toLowerCase();
  if(head.includes('<html') || head.includes('<table')){
    return {html: new TextDecoder('utf-8').decode(buf)};
  }
  const wb = XLSX.read(buf, {type:'array', cellDates:true});
  const sheets = {};
  for(const n of wb.SheetNames) sheets[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:true, defval:'', blankrows:false});
  return {sheets};
}
function htmlTables(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  return {doc, tables:[...doc.querySelectorAll('table')].map(t=>[...t.rows].map(r=>[...r.cells].map(c=>c.textContent.replace(/\s+/g,' ').trim())))};
}
const findHeader = (aoa, pred) => aoa.findIndex((r,i)=>i<30 && pred(r.map(c=>normName(c))));
function detectType(wb){
  if(wb.html) return 'hours';
  for(const aoa of Object.values(wb.sheets)){
    const flat = aoa.slice(0,30).flat().map(normName);
    if(flat.some(c=>c.includes('לפני מע"מ')) && flat.includes('לקוח')) return 'revenue';
    if(flat.some(c=>c==='עלות מעביד'||c==='עלות עובד')) return 'payroll';
    if(flat.includes('סה"כ שעות') && flat.includes('משימה')) return 'hours';
  }
  return null;
}

/* --- דוח הכנסות מהנהלת החשבונות ---
   חשבוניות מס ואחריהן חשבוניות זיכוי. הזיכויים מופיעים בקובץ כסכום חיובי,
   ומה שמזהה אותם הוא שורת "סה"כ בחשבוניות זיכוי" שאחריהם. */
function parseRevenue(wb, fileName){
  const aoa = Object.values(wb.sheets).find(a=>findHeader(a, r=>r.includes('לקוח') && r.some(c=>c.includes('לפני מע"מ')))>=0);
  const hi = findHeader(aoa, r=>r.includes('לקוח') && r.some(c=>c.includes('לפני מע"מ')));
  const H = aoa[hi].map(normName);
  const iC=H.indexOf('לקוח'), iNo=H.findIndex(h=>h.includes('מספר מסמך')), iD=H.indexOf('תאריך'), iA=H.findIndex(h=>h.includes('לפני מע"מ'));
  const docs=[], sections=[]; let cur=[];
  const closeSection = (label, footer) => {
    const credit = /זיכוי/.test(label);
    cur.forEach(d=>{ d.t = credit?'cr':'inv'; docs.push(d); });
    sections.push({label, credit, count:cur.length, sum:cur.reduce((a,d)=>a+d.a,0), footer}); cur=[];
  };
  let netFooter = null;
  for(const r of aoa.slice(hi+1)){
    const c0 = normName(r[iC]);
    if(/^סה"כ/.test(c0) || /^סיכומים/.test(c0)){
      const f = r.map(num).find((v,i)=>i>iC && v!=null);
      if(/^סיכומים/.test(c0)) netFooter = f; else closeSection(c0, f);
      continue;
    }
    const a = num(r[iA]), no = num(r[iNo]);
    if(c0 && a!=null && no!=null) cur.push({c:c0, no, d:String(r[iD]??''), a});
  }
  if(cur.length) closeSection('חשבוניות', null);
  const clients = {};
  for(const d of docs){ const x = clients[d.c] ||= {inv:0, cr:0, n:0}; x[d.t]+=d.a; x.n++; }
  const inv = docs.filter(d=>d.t==='inv').reduce((a,d)=>a+d.a,0), cr = docs.filter(d=>d.t==='cr').reduce((a,d)=>a+d.a,0);
  const title = aoa.slice(0,hi).flat().join(' ');
  const tm = title.match(/(\d{2})-(\d{2})-(\d{4})/);
  const ym = majority(docs.map(d=>dateYm(d.d))) || (tm && ymOf(tm[3],tm[2]));
  return {ym, data:{file:fileName, uploadedAt:new Date().toISOString(), clients, docs:docs.map(d=>({c:d.c,no:d.no,d:d.d,a:round2(d.a),t:d.t})),
          totals:{inv:round2(inv), cr:round2(cr), net:round2(inv-cr)}, sections:sections.map(s=>({...s, sum:round2(s.sum)})), netFooter}};
}
const round2 = v => Math.round(v*100)/100;

/* --- דוח משימות מ-TimeWatch (קובץ HTML עם סיומת xls) ---
   כל משמרת היא שורה. האתר מזוהה לפי הקוד בסוגריים בשם המשימה. */
function siteKey(task){
  const m = String(task).match(/\((\d+)\)\s*(?:\(\d+\)\s*)?$/);
  return m ? m[1] : 'n:' + normName(task);
}
const siteLabel = s => normName(String(s).replace(/\s*\(\d*\)?\s*(\(\d+\)\s*)?$/,'').replace(/\s*\(\d+$/,''));
function parseHours(wb, fileName){
  let aoa, title='';
  if(wb.html){ const {doc, tables} = htmlTables(wb.html); aoa = tables.find(t=>findHeader(t, r=>r.includes('משימה') && r.includes('סה"כ שעות'))>=0); title = doc.body?.textContent||''; }
  else aoa = Object.values(wb.sheets).find(a=>findHeader(a, r=>r.includes('משימה') && r.includes('סה"כ שעות'))>=0);
  if(!aoa) throw new Error('לא נמצאה טבלת משימות בקובץ');
  const hi = findHeader(aoa, r=>r.includes('משימה') && r.includes('סה"כ שעות'));
  const H = aoa[hi].map(normName); const col = n => H.indexOf(n);
  const iDate=col('תאריך'), iEmp=col("מס' עובד"), iBr=col('סניף'), iCl=col('לקוח'), iTask=col('משימה'), iOut=col('שעת יציאה'), iH=col('סה"כ שעות');
  const sites = {}; let total=0, footer=null, shifts=0; const flags={zero:0, long:0, noexit:0}; const yms=[];
  for(const r of aoa.slice(hi+1)){
    if(normName(r[iDate])==='סה"כ'){ footer = num(r[iH]); continue; }
    const h = num(r[iH]); if(h==null || !r[iTask]) continue;
    const k = siteKey(r[iTask]);
    const s = sites[k] ||= {name:siteLabel(r[iTask]), branch:normName(r[iBr])||NO_BRANCH, client:normName(r[iCl]), h:0, shifts:0, emps:{}, branches:{}};
    s.h += h; s.shifts++; s.emps[r[iEmp]]=1; s.branches[normName(r[iBr])||NO_BRANCH]=(s.branches[normName(r[iBr])||NO_BRANCH]||0)+h;
    total += h; shifts++; yms.push(dateYm(r[iDate]));
    if(h<=0) flags.zero++; if(h>12) flags.long++; if(!String(r[iOut]??'').trim()) flags.noexit++;
  }
  const out = {};
  for(const [k,s] of Object.entries(sites)){
    const br = Object.entries(s.branches).sort((a,b)=>b[1]-a[1]);
    out[k] = {name:s.name, branch:br[0][0], client:s.client, h:round2(s.h), shifts:s.shifts, emps:Object.keys(s.emps).length, multiBranch:br.length>1};
  }
  const tm = title.match(/לחודש\s+(\d{2})\/(\d{4})/);
  const ym = (tm && ymOf(tm[2],tm[1])) || majority(yms);
  return {ym, data:{file:fileName, uploadedAt:new Date().toISOString(), sites:out, total:round2(total), footer, shifts, flags}};
}

/* --- דוח שכר ---
   גיליון הפיצול (עובד × משנה/אתר) נותן את עלות המעביד לכל אתר.
   לאימות: גיליון "דוח מעסיק" אם צורף, אחרת שורת "סיכום למפעל" בגיליון הפיצול.
   שמות העמודות משתנים בין ייצואים ("תאריך" / "תאריך עבודה"), ולכן הזיהוי לפי תוכן. */
function parsePayroll(wb, fileName){
  let split=null, summary=null;
  for(const aoa of Object.values(wb.sheets)){
    const hi = findHeader(aoa, r=>r.includes('מספר עובד'));
    if(hi<0) continue;
    const H = aoa[hi].map(normName);
    const iSub = H.indexOf('משנה'), iEmp = H.indexOf('מספר עובד');
    const hasCost = H.includes('עלות עובד') || H.includes('עלות מעביד');
    // בגיליון הפיצול בעמודת "משנה" יש קוד אתר בשורות העובדים; בדוח המעסיק היא ריקה
    // רק שורות עובד (עמודה ראשונה ריקה); שורות "סיכום למשנה" מכילות מספרים באותן עמודות
    const siteRows = iSub<0 ? 0 : aoa.slice(hi+1).filter(r=>!normName(r[0]) && num(r[iEmp])!=null && num(r[iSub])!=null).length;
    if(hasCost && siteRows>0 && siteRows>(split?.siteRows||0)){ if(split && split.H.includes('עלות מעביד')) summary = split; split = {aoa, hi, H, iSub, siteRows}; }
    else if(H.includes('עלות מעביד')) summary = {aoa, hi, H};
  }
  if(!split) throw new Error('לא נמצא גיליון עם פיצול עלות לפי אתר (עמודת "משנה")');
  const {aoa, hi, H, iSub} = split;
  const iEmp=H.indexOf('מספר עובד'), iCost = H.includes('עלות עובד') ? H.indexOf('עלות עובד') : H.indexOf('עלות מעביד'), iDate=H.findIndex(h=>h.startsWith('תאריך'));
  const sites = {}, emps = {}, yms=[]; let total=0;
  for(const r of aoa.slice(hi+1)){
    const emp = num(r[iEmp]), code = num(r[iSub]), cost = num(r[iCost]);
    if(emp==null || cost==null || code==null) continue;
    const k = String(code);
    const s = sites[k] ||= {name:siteLabel(r[iSub+1]||k), cost:0, emps:{}};
    s.cost += cost; s.emps[emp]=1; emps[emp]=1; total += cost; yms.push(dateYm(r[iDate]));
  }
  let employerTotal = null, employerCount = null, checkSource = null;
  const plantRow = aoa.slice(hi+1).find(r=>/סיכום\s+למפעל/.test(normName(r[0])));
  if(plantRow && num(plantRow[iCost])!=null){ employerTotal = num(plantRow[iCost]); checkSource = 'plant'; }
  if(summary){ checkSource = 'summary';
    const S = summary.H, iE = S.indexOf('מספר עובד'), iEC = S.indexOf('עלות מעביד');
    const rows = summary.aoa.slice(summary.hi+1).filter(r=>!normName(r[0]) && num(r[iE])!=null && num(r[iEC])!=null);
    employerTotal = round2(rows.reduce((a,r)=>a+num(r[iEC]),0)); employerCount = rows.length;
  }
  const out = {}; for(const [k,s] of Object.entries(sites)) out[k] = {name:s.name, cost:round2(s.cost), emps:Object.keys(s.emps).length};
  return {ym: majority(yms), data:{file:fileName, uploadedAt:new Date().toISOString(), sites:out, total:round2(total), employees:Object.keys(emps).length, employerTotal, employerCount, checkSource}};
}

/* ============================================================ חישוב רווחיות לחודש */
function siteIndex(){ const m={}; mapping.groups.forEach(g=>g.sites.forEach(s=>m[s]=g)); return m; }
function clientIndex(){ const m={}; mapping.groups.forEach(g=>g.clients.forEach(c=>m[c]=g)); return m; }
const isOverhead = code => mapping.overheadSites.includes(String(code));

function compute(ym){
  const M = months[ym] || {};
  const rev = M.revenue?.clients || {}, hs = M.hours?.sites || {}, pay = M.payroll?.sites || {};
  const bySite = siteIndex(), byClient = clientIndex();
  const G = {}; // group id -> result
  const get = g => G[g.id] ||= {id:g.id, name:g.name, group:g, rev:0, h:0, cost:0, sites:{}, clients:{}};
  const unSites = {}, unClients = {};
  let overhead = 0;
  const codes = new Set([...Object.keys(hs), ...Object.keys(pay)]);
  for(const code of codes){
    const h = hs[code]?.h || 0, cost = pay[code]?.cost || 0;
    const info = {code, name:hs[code]?.name || pay[code]?.name || code, branch:hs[code]?.branch || NO_BRANCH, h, cost};
    if(isOverhead(code)){ overhead += cost; continue; }
    const g = bySite[code];
    if(!g){ unSites[code] = info; continue; }
    const r = get(g); r.h += h; r.cost += cost; r.sites[code] = info;
  }
  for(const [name, x] of Object.entries(rev)){
    const net = x.inv - x.cr, g = byClient[name];
    if(!g){ unClients[name] = {name, rev:net}; continue; }
    const r = get(g); r.rev += net; r.clients[name] = net;
  }
  // הכנסה משויכת לסניף דרך האתרים, לפי חלק השעות של כל אתר בקבוצה
  const branches = {};
  const B = b => branches[b] ||= {name:b, rev:0, h:0, cost:0, groups:0};
  for(const r of Object.values(G)){
    const sites = Object.values(r.sites);
    const weightOf = s => r.h>0 ? s.h/r.h : r.cost>0 ? s.cost/r.cost : 1/sites.length;
    const share = {};
    sites.forEach(s=>{ share[s.branch]=(share[s.branch]||0)+weightOf(s); s.revShare = r.rev*weightOf(s); });
    if(!sites.length) share[NO_BRANCH]=1;
    r.branchShare = share;
    r.branch = Object.entries(share).sort((a,b)=>b[1]-a[1])[0][0];
    r.branchList = Object.keys(share);
    for(const [b,w] of Object.entries(share)){ const x=B(b); x.rev += r.rev*w; x.groups++; }
    sites.forEach(s=>{ const x=B(s.branch); x.h += s.h; x.cost += s.cost; });
    r.gp = r.rev - r.cost; r.margin = r.rev ? r.gp/r.rev : NaN; r.revH = r.h ? r.rev/r.h : NaN; r.costH = r.h ? r.cost/r.h : NaN;
    r.flags = flagsOf(r);
  }
  for(const s of Object.values(unSites)){ const x=B(s.branch); x.h+=s.h; x.cost+=s.cost; }
  Object.values(branches).forEach(b=>{ b.gp=b.rev-b.cost; b.margin=b.rev?b.gp/b.rev:NaN; b.revH=b.h?b.rev/b.h:NaN; b.costH=b.h?b.cost/b.h:NaN; });
  const list = Object.values(G);
  const tot = {rev:list.reduce((a,r)=>a+r.rev,0)+Object.values(unClients).reduce((a,c)=>a+c.rev,0),
               cost:list.reduce((a,r)=>a+r.cost,0)+Object.values(unSites).reduce((a,s)=>a+s.cost,0),
               h:list.reduce((a,r)=>a+r.h,0)+Object.values(unSites).reduce((a,s)=>a+s.h,0), overhead};
  tot.gp = tot.rev - tot.cost; tot.margin = tot.rev?tot.gp/tot.rev:NaN; tot.net = tot.gp - overhead; tot.netMargin = tot.rev?tot.net/tot.rev:NaN;
  tot.revH = tot.h?tot.rev/tot.h:NaN; tot.costH = tot.h?tot.cost/tot.h:NaN;
  return {ym, groups:list, branches, unSites, unClients, tot, has:{rev:!!M.revenue, hours:!!M.hours, pay:!!M.payroll}};
}
function flagsOf(r){
  const f = [];
  if(r.rev>0 && r.gp<0) f.push(['bad','הפסד']);
  else if(r.rev>0 && r.margin<LOW_MARGIN) f.push(['warn','רווח נמוך']);
  if(r.costH>COST_H_HIGH) f.push(['warn','עלות שעה חריגה']);
  if(r.h>0 && r.rev>0 && (r.revH<REV_H[0] || r.revH>REV_H[1])) f.push(['info','לבדוק התאמה']);
  if(r.h>0 && !r.rev) f.push(['info','שעות בלי הכנסה']);
  if(r.rev>0 && !r.h && !r.cost && r.group.sites.length) f.push(['info','הכנסה בלי שעות']);
  if(!f.length) f.push(['good','תקין']);
  return f;
}
const branchNames = () => { const s=new Set(); Object.values(months).forEach(m=>Object.values(m.hours?.sites||{}).forEach(x=>s.add(x.branch))); return [...s].sort(); };
const monthList = () => Object.keys(months).sort();
function allUnmatched(){
  const bySite = siteIndex(), byClient = clientIndex(), sites={}, clients={};
  for(const [ym,M] of Object.entries(months)){
    for(const [code,s] of Object.entries(M.hours?.sites||{})) if(!bySite[code] && !isOverhead(code)){ const x=sites[code] ||= {code,name:s.name,branch:s.branch,h:0,cost:0,months:new Set()}; x.h+=s.h; x.months.add(ym); }
    for(const [code,s] of Object.entries(M.payroll?.sites||{})) if(!bySite[code] && !isOverhead(code)){ const x=sites[code] ||= {code,name:s.name,branch:NO_BRANCH,h:0,cost:0,months:new Set()}; x.cost+=s.cost; x.months.add(ym); }
    for(const [c,x] of Object.entries(M.revenue?.clients||{})) if(!byClient[c]){ const y=clients[c] ||= {name:c,rev:0,months:new Set()}; y.rev+=x.inv-x.cr; y.months.add(ym); }
  }
  return {sites:Object.values(sites), clients:Object.values(clients)};
}

/* ============================================================ תקופות: חודש, רבעון, מצטבר
   ui.ym הוא חודש העוגן. ברבעון: הרבעון שהוא נמצא בו. במצטבר: מינואר ועד אליו. */
const QN = ['ראשון','שני','שלישי','רביעי'];
function periodOf(mode, ym){
  if(!ym) return null;
  const y = +ym.slice(0,4), m = +ym.slice(5), have = new Set(monthList());
  let all, label, short, prev = null;
  if(mode==='quarter'){
    const q = Math.ceil(m/3); all = [1,2,3].map(i=>ymOf(y,(q-1)*3+i));
    label = `רבעון ${QN[q-1]} ${y} (${MONTHS[(q-1)*3]}–${MONTHS[(q-1)*3+2]})`; short = `רבעון ${q}/${y}`;
    const pq = q===1 ? [y-1,4] : [y,q-1];
    const pAll = [1,2,3].map(i=>ymOf(pq[0],(pq[1]-1)*3+i)).filter(x=>have.has(x));
    if(pAll.length) prev = {months:pAll, short:`רבעון ${pq[1]}/${pq[0]}`};
  } else if(mode==='ytd'){
    all = Array.from({length:m},(_,i)=>ymOf(y,i+1));
    label = `מצטבר ${MONTHS[0]}–${MONTHS[m-1]} ${y}`; short = `${MONTHS[0]}–${MONTHS[m-1]} ${y}`;
    const pAll = Array.from({length:m},(_,i)=>ymOf(y-1,i+1)).filter(x=>have.has(x));
    if(pAll.length) prev = {months:pAll, short:`התקופה המקבילה אשתקד`};
  } else {
    all = [ym]; label = monthName(ym); short = MONTHS[m-1];
    const pm = monthList().filter(x=>x<ym).pop(); if(pm) prev = {months:[pm], short:MONTHS[+pm.slice(5)-1]};
  }
  const months_ = all.filter(x=>have.has(x));
  return {mode, all, months:months_, absent:all.filter(x=>!have.has(x)), label, short, prev, key: mode==='month'?ym:mode==='quarter'?`${y}-Q${Math.ceil(m/3)}`:`${y}-YTD-${String(m).padStart(2,'0')}`};
}
const period = () => periodOf(ui.pmode, ui.ym);
// סכימת כמה חודשים: מחברים סכומים לפי לקוח/אתר/סניף ומחשבים מחדש שיעורים וסטטוסים
function computePeriod(yms){
  const parts = yms.map(compute);
  if(parts.length===1) return parts[0];
  const G={}, branches={}, unSites={}, unClients={};
  for(const R of parts){
    for(const g of R.groups){
      const x = G[g.id] ||= {id:g.id, name:g.name, group:g.group, rev:0, h:0, cost:0, sites:{}, clients:{}, weight:{}};
      x.rev+=g.rev; x.h+=g.h; x.cost+=g.cost;
      for(const st of Object.values(g.sites)){ const y = x.sites[st.code] ||= {code:st.code, name:st.name, branch:st.branch, h:0, cost:0, revShare:0}; y.h+=st.h; y.cost+=st.cost; y.revShare+=st.revShare||0; }
      for(const [c,a] of Object.entries(g.clients)) x.clients[c]=(x.clients[c]||0)+a;
      for(const [b,w] of Object.entries(g.branchShare)) x.weight[b]=(x.weight[b]||0)+w*(g.rev+g.h+1);
    }
    for(const b of Object.values(R.branches)){ const y = branches[b.name] ||= {name:b.name, rev:0, h:0, cost:0}; y.rev+=b.rev; y.h+=b.h; y.cost+=b.cost; }
    for(const st of Object.values(R.unSites)){ const y = unSites[st.code] ||= {...st, h:0, cost:0}; y.h+=st.h; y.cost+=st.cost; }
    for(const c of Object.values(R.unClients)){ const y = unClients[c.name] ||= {name:c.name, rev:0}; y.rev+=c.rev; }
  }
  const groups = Object.values(G);
  for(const r of groups){
    const w = Object.entries(r.weight).sort((a,b)=>b[1]-a[1]);
    r.branchList = w.map(x=>x[0]); r.branch = w[0][0];
    r.gp = r.rev-r.cost; r.margin = r.rev? r.gp/r.rev : NaN; r.revH = r.h? r.rev/r.h : NaN; r.costH = r.h? r.cost/r.h : NaN; r.flags = flagsOf(r);
  }
  Object.values(branches).forEach(b=>{ b.gp=b.rev-b.cost; b.margin=b.rev?b.gp/b.rev:NaN; b.revH=b.h?b.rev/b.h:NaN; b.costH=b.h?b.cost/b.h:NaN; });
  const tot = ['rev','cost','h','overhead'].reduce((o,k)=>(o[k]=parts.reduce((a,R)=>a+R.tot[k],0),o),{});
  tot.gp = tot.rev-tot.cost; tot.margin = tot.rev?tot.gp/tot.rev:NaN; tot.net = tot.gp-tot.overhead; tot.netMargin = tot.rev?tot.net/tot.rev:NaN;
  tot.revH = tot.h?tot.rev/tot.h:NaN; tot.costH = tot.h?tot.cost/tot.h:NaN;
  return {ym:yms[yms.length-1], yms, parts, groups, branches, unSites, unClients, tot,
          has:{rev:parts.every(R=>R.has.rev), hours:parts.every(R=>R.has.hours), pay:parts.every(R=>R.has.pay)}};
}
function periodGaps(per){
  const out = per.absent.length ? [`${per.absent.length>1?'לא נקלטו':'לא נקלט'}: ${per.absent.map(m=>MONTHS[+m.slice(5)-1]).join(', ')}`] : [];
  for(const m of per.months){ const M = months[m]; const miss = [['revenue','הכנסות'],['hours','שעות'],['payroll','שכר']].filter(([k])=>!M[k]).map(x=>x[1]);
    if(miss.length) out.push(`${MONTHS[+m.slice(5)-1]}: חסר דוח ${miss.join(' ו')}`); }
  return out;
}

/* ============================================================ רינדור */
const TABS = [['overview','סקירה ותובנות'],['clients','רווחיות לקוחות'],['client','כרטיס לקוח'],['match','התאמת לקוחות'],['data','קליטת נתונים']];

      <label>${pm==='ytd'?'עד חודש':pm==='quarter'?'רבעון':'חודש'} <select id="f-ym">${anchors.slice().reverse().map(m=>{ const P=periodOf(pm,m);
        return `<option value="${m}" ${m===cur?'selected':''}>${pm==='month'?monthName(m):pm==='quarter'?`${P.short}${P.months.length<3?` (${P.months.length} מתוך 3 חודשים)`:''}`:`${monthName(m)}`}</option>`; }).join('')}</select></label>
      <label>סניף <select id="f-branch"><option value="">כל הסניפים</option>${branchNames().concat([NO_BRANCH]).map(b=>`<option ${b===ui.branch?'selected':''}>${esc(b)}</option>`).join('')}</select></label>
      ${ui.tab==='clients'?`<label>חיפוש <input type="text" id="f-q" value="${esc(ui.q)}" placeholder="שם לקוח או אתר"></label>`:''}`;
  } else $('#filters').innerHTML='';
  Object.values(charts).forEach(c=>c.destroy()); for(const k in charts) delete charts[k];
  const v = $('#view');
  if(!ms.length && ui.tab!=='data' && ui.tab!=='match'){ v.innerHTML = `<div class="panel empty"><h2 style="margin-bottom:6px">עדיין אין נתונים</h2><p>יש להעלות את שלושת הדוחות החודשיים בלשונית "קליטת נתונים".</p><p style="margin-top:12px"><button class="btn primary" type="button" data-tab="data">לקליטת נתונים</button></p></div>`; return; }
  ({overview:renderOverview, clients:renderClients, client:renderClient, match:renderMatch, data:renderData})[ui.tab](v);
}

/* ---------- סקירה ---------- */
function renderOverview(v){

  const P = per.prev ? computePeriod(per.prev.months) : null;
  const d = (cur, prev, better='up', isPct=false) => {
    if(prev==null || !isFinite(prev) || !isFinite(cur) || (!isPct && !prev)) return '';
    const diff = isPct ? cur-prev : (cur-prev)/Math.abs(prev); const good = better==='up' ? diff>=0 : diff<=0;
    return `<span class="delta ${good?'good':'bad'}">${diff>=0?'▲':'▼'} ${isPct? ltr(Math.abs(diff*100).toFixed(1)+' נק׳') : pct(Math.abs(diff))} מול ${per.prev.short}</span>`;
  };
  const kpi = (l, val, sub) => `<div class="kpi"><span class="label">${l}</span><span class="value num">${val}</span><span class="sub">${sub||'&nbsp;'}</span></div>`;
  const brs = Object.values(R.branches).filter(b=>b.rev||b.cost).sort((a,b)=>b.rev-a.rev);
  const brNames = branchNames();

    <div class="kpis">
      ${kpi('הכנסות (לפני מע״מ)', moneyC(T.rev), d(T.rev, P?.tot.rev))}
      ${kpi('עלות מעביד באתרים', moneyC(T.cost), `${hrs(T.h)} שעות · ${perH(T.costH)} לשעה`)}
      ${kpi('רווח גולמי', moneyC(T.gp), `שיעור ${pct(T.margin)} ${d(T.margin, P?.tot.margin, 'up', true)}`)}
      ${kpi('אחרי שכר הנהלה', moneyC(T.net), `שכר הנהלה ${moneyC(T.overhead)} · שיעור ${pct(T.netMargin)}`)}
    </div>
    <div class="grid2">
      <div class="stack">

            <tbody>${brs.map(b=>{ const pb = P?.branches[b.name];

              ${P?`<td class="n">${pb&&isFinite(pb.margin)&&isFinite(b.margin)?`<span class="delta ${b.margin>=pb.margin?'good':'bad'}">${ltr((b.margin>=pb.margin?'+':'−')+Math.abs((b.margin-pb.margin)*100).toFixed(1)+' נק׳')}</span>`:'—'}</td>`:''}</tr>`;}).join('')}
            <tr class="total"><td class="first">סה״כ אתרים</td><td class="n">${money(T.rev)}</td><td class="n">${hrs(T.h)}</td><td class="n">${money(T.cost)}</td><td class="n">${money(T.gp)}</td><td class="n">${pct(T.margin)}</td><td class="n">${perH(T.revH)}</td><td class="n">${perH(T.costH)}</td>${P?'<td></td>':''}</tr>

          <div class="legend">${chartMonths.length>1 ? brNames.map(b=>`<span><i class="line" style="background:var(${color(b)})"></i>${esc(b)}</span>`).join('') : '<span><i style="background:var(--s1)"></i>הכנסות</span><span><i style="background:var(--s2)"></i>עלות מעביד</span>'}</div>

      </section>
    </div>
    ${R.parts?monthTable(R):''}
  </div>`;
  if(chartMonths.length>1){
    const ms = chartMonths;
    drawChart('ch-main', {type:'line', data:{labels:ms.map(m=>MONTHS[+m.slice(5)-1]), datasets: brNames.map(b=>({label:b, data:ms.map(m=>{ const x=compute(m).branches[b]; return x&&x.rev? x.margin*100 : null; }),
      borderColor:cv(color(b)), backgroundColor:cv(color(b)), borderWidth:2, pointRadius:4, pointBorderColor:cv('--surface'), pointBorderWidth:2, tension:.2}))}}, v=>v.toFixed(0)+'%', c=>` ${c.dataset.label}: ${c.parsed.y.toFixed(1)}%`);
  } else {
    drawChart('ch-main', {type:'bar', data:{labels:brs.map(b=>b.name), datasets:[
      {label:'הכנסות', data:brs.map(b=>b.rev), backgroundColor:cv('--s1'), borderRadius:4, maxBarThickness:36},
      {label:'עלות מעביד', data:brs.map(b=>b.cost), backgroundColor:cv('--s2'), borderRadius:4, maxBarThickness:36}]}}, v=>'₪'+nfc.format(v), c=>` ${c.dataset.label}: ${moneyRaw(c.parsed.y)}`);
  }
}
function monthTable(R){
  return `<section class="panel">
    <div class="panel-head"><h2>פירוט לפי חודש</h2></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th class="first">חודש</th><th class="n">הכנסות</th><th class="n">שעות</th><th class="n">עלות מעביד</th><th class="n">רווח גולמי</th><th class="n">שיעור</th><th class="n">שכר הנהלה</th><th class="n">אחרי שכר הנהלה</th><th class="n">שיעור</th></tr></thead>
      <tbody>${R.parts.map(p=>{ const t=p.tot; return `<tr><td class="first">${monthName(p.ym)}</td><td class="n">${money(t.rev)}</td><td class="n">${hrs(t.h)}</td><td class="n">${money(t.cost)}</td><td class="n">${money(t.gp)}</td><td class="n">${marginPill(t.margin,t.rev)}</td><td class="n">${money(t.overhead)}</td><td class="n">${money(t.net)}</td><td class="n">${marginPill(t.netMargin,t.rev)}</td></tr>`; }).join('')}
      ${(()=>{ const t=R.tot; return `<tr class="total"><td class="first">סה״כ</td><td class="n">${money(t.rev)}</td><td class="n">${hrs(t.h)}</td><td class="n">${money(t.cost)}</td><td class="n">${money(t.gp)}</td><td class="n">${pct(t.margin)}</td><td class="n">${money(t.overhead)}</td><td class="n">${money(t.net)}</td><td class="n">${pct(t.netMargin)}</td></tr>`; })()}
      </tbody></table></div></section>`;
}
function marginPill(m, rev){
  if(!rev || !isFinite(m)) return '—';
  return `<span class="pill ${m<0?'bad':m<LOW_MARGIN?'warn':'good'}">${pct(m)}</span>`;
}
function insights(R, P, per){
  const out = [], T = R.tot, gs = R.groups.filter(g=>g.rev>0);
  const brs = Object.values(R.branches).filter(b=>b.rev>0 && b.name!==NO_BRANCH).sort((a,b)=>a.margin-b.margin);
  out.push({level: T.netMargin>=0.08?'good':T.netMargin>=0?'warn':'bad', title:`רווח גולמי ${pct(T.margin)}; אחרי שכר הנהלה ${pct(T.netMargin)}`,
    text:`מתוך הכנסות של <b>${money(T.rev)}</b> נשארו <b>${money(T.gp)}</b> אחרי עלות המעביד באתרים, ו-<b>${money(T.net)}</b> אחרי שכר ההנהלה (${money(T.overhead)}).`});
  if(brs.length>=2){ const lo=brs[0], hi=brs[brs.length-1];
    out.push({level: hi.margin-lo.margin>0.05?'warn':'info', title:`פער בין הסניפים: ${esc(hi.name)} ${pct(hi.margin)}, ${esc(lo.name)} ${pct(lo.margin)}`,
      text:`בסניף ${esc(lo.name)} ההכנסה לשעה היא ${perH(lo.revH)} והעלות לשעה ${perH(lo.costH)}, לעומת ${perH(hi.revH)} ו-${perH(hi.costH)} בסניף ${esc(hi.name)}.`}); }
  const loss = gs.filter(g=>g.gp<0).sort((a,b)=>a.gp-b.gp);
  if(loss.length) out.push({level:'bad', title:`${loss.length} לקוחות בהפסד, בסך ${money(-loss.reduce((a,g)=>a+g.gp,0))}`,
    text: loss.slice(0,4).map(g=>`<b>${esc(g.name)}</b> (${money(g.gp)}, עלות ${perH(g.costH)} לשעה מול הכנסה ${perH(g.revH)})`).join(' · ') + (loss.length>4?` ועוד ${loss.length-4}.`:'.')});
  const low = gs.filter(g=>g.gp>=0 && g.margin<LOW_MARGIN);
  if(low.length) out.push({level:'warn', title:`${low.length} לקוחות עם רווח גולמי מתחת ל-${pct(LOW_MARGIN,0)}`,
    text: low.sort((a,b)=>b.rev-a.rev).slice(0,5).map(g=>`${esc(g.name)} (${pct(g.margin)})`).join(' · ') + '. כדאי לבדוק תמחור או שיבוץ.'});
  const costly = R.groups.filter(g=>g.h>=10 && g.costH>COST_H_HIGH).sort((a,b)=>b.costH-a.costH);
  if(costly.length) out.push({level:'warn', title:`עלות מעביד לשעה חריגה ב-${costly.length} לקוחות`,
    text: costly.slice(0,4).map(g=>`${esc(g.name)}: ${perH(g.costH)}`).join(' · ') + `. הממוצע בארגון ${perH(T.costH)}. ייתכן עובד ותיק, שעות נוספות או פיצול שכר לא מדויק.`});
  const suspect = R.groups.filter(g=>g.flags.some(f=>f[1]==='לבדוק התאמה'));
  if(suspect.length) out.push({level:'info', title:`${suspect.length} התאמות עם הכנסה לשעה חריגה`,
    text: suspect.map(g=>`${esc(g.name)} (${perH(g.revH)})`).join(' · ') + `. בדרך כלל ההכנסה לשעה בין ${ltr('₪'+REV_H[0])} ל-${ltr('₪'+REV_H[1])}. ייתכן שחסר אתר או לקוח בקבוצה.`});
  if(P){
    const ch = (T.rev-P.tot.rev)/P.tot.rev;
    out.push({level: ch>=0?'good':'warn', title:`ההכנסות ${ch>=0?'עלו':'ירדו'} ב-${pct(Math.abs(ch))} מול ${per.prev.short}`,
      text:`${money(T.rev)} לעומת ${money(P.tot.rev)}. השעות ${T.h>=P.tot.h?'עלו':'ירדו'} ב-${pct(Math.abs((T.h-P.tot.h)/P.tot.h))}.`});
  }
  const unS = Object.values(R.unSites), unC = Object.values(R.unClients);
  if(unS.length || unC.length) out.push({level:'warn', title:`${unS.length+unC.length} פריטים ממתינים להתאמה`,
    text:`${unC.length?`${unC.length} לקוחות מהנהלת החשבונות (${money(unC.reduce((a,c)=>a+c.rev,0))})`:''}${unC.length&&unS.length?' ו-':''}${unS.length?`${unS.length} אתרים (${hrs(unS.reduce((a,s)=>a+s.h,0))} שעות, ${money(unS.reduce((a,s)=>a+s.cost,0))} עלות)`:''}. הם נספרים בסיכום הכללי אבל לא בלקוחות. <button class="btn sm" type="button" data-tab="match">להתאמה</button>`});
  return out;
}

async function assign(kind, key, target){
  if(!target) return;
  if(target==='__overhead'){ mapping.overheadSites.push(key); }
  else {
    let g = mapping.groups.find(x=>x.id===target);
    if(target==='__new'){
      const name = kind==='site' ? (allUnmatched().sites.find(s=>s.code===key)?.name||key) : key.replace(/\s*בע"מ.*$|\s*\(ע"ר\).*$/,'');
      g = {id:'g'+Date.now().toString(36), name, sites:[], clients:[]}; mapping.groups.push(g);
    }
    (kind==='site' ? g.sites : g.clients).push(key);
  }
  await store.saveMapping(); render(); toast('ההתאמה נשמרה');
}

function monthCard(ym){
  const M = months[ym];
  const slot = (label, x, checks) => `<div class="slot">${x?'<span class="pill good">נקלט</span>':'<span class="pill warn">חסר</span>'}<h3>${label}</h3>
    <div>${x?`<div class="small muted">${esc(x.file)} · ${new Date(x.uploadedAt).toLocaleDateString('he-IL')}</div><ul class="checks">${checks(x).map(([lvl,t])=>`<li class="${lvl}">${t}</li>`).join('')}</ul>`:'<span class="small muted">יש להעלות את הדוח לחודש הזה</span>'}</div></div>`;
  const near = (a,b) => a!=null && b!=null && Math.abs(a-b)<0.5;
  return `<article class="month-card">
    <div class="actions" style="justify-content:space-between"><h2>${monthName(ym)}</h2><button class="btn danger sm" type="button" data-delmonth="${ym}">מחיקת החודש</button></div>
    ${slot('הכנסות · הנהלת חשבונות', M.revenue, x=>{
      const c=[]; x.sections.forEach(s=>c.push([s.footer==null?'warn':near(s.sum,s.footer)?'':'bad', `${s.credit?'חשבוניות זיכוי':'חשבוניות מס'}: ${s.count}, ${money(s.sum)}${s.footer!=null?(near(s.sum,s.footer)?' · תואם לשורת הסיכום':` · שורת הסיכום: ${money(s.footer)}`):''}`]));
      c.push([x.netFooter==null||near(x.totals.net,x.netFooter)?'':'bad', `נטו ${money(x.totals.net)} · ${Object.keys(x.clients).length} לקוחות. הזיכויים קוזזו`]);
      return c; })}
    ${slot('שעות · TimeWatch', M.hours, x=>{
      const c=[[x.footer==null?'warn':near(x.total,x.footer)?'':'bad', `${hrs(x.total)} שעות ב-${nf0.format(x.shifts)} משמרות, ${Object.keys(x.sites).length} אתרים${x.footer!=null&&near(x.total,x.footer)?' · תואם לסיכום':''}`]];
      const f=x.flags; if(f.zero||f.long||f.noexit) c.push(['warn', `חריגים: ${f.zero} משמרות של 0 שעות, ${f.long} משמרות מעל 12 שעות, ${f.noexit} בלי שעת יציאה`]);
      const multi = Object.values(x.sites).filter(s=>s.multiBranch).length; if(multi) c.push(['warn', `${multi} אתרים רשומים ביותר מסניף אחד`]);
      return c; })}
    ${slot('שכר · עלות מעביד', M.payroll, x=>{
      const c=[[x.employerTotal==null?'warn':near(x.total,x.employerTotal)?'':'bad', `עלות מעביד ${money(x.total)} · ${x.employees} עובדים${x.employerTotal!=null?(near(x.total,x.employerTotal)?(x.checkSource==='plant'?' · תואם לשורת "סיכום למפעל"':' · הפיצול לאתרים תואם לדוח המעסיק'):` · ${x.checkSource==='plant'?'בשורת הסיכום':'בדוח המעסיק'}: ${money(x.employerTotal)}`):''}`]];
      const noH = Object.keys(x.sites).filter(k=>!isOverhead(k) && M.hours && !M.hours.sites[k]); if(noH.length) c.push(['warn', `${noH.length} אתרים עם עלות שכר בלי שעות ב-TimeWatch: ${noH.map(k=>esc(x.sites[k].name)).join(', ')}`]);
      return c; })}
  </article>`;
}
async function handleFiles(files){
  for(const f of files){
    try{
      const wb = await readWorkbook(f);
      const type = detectType(wb);
      if(!type){ toast(`לא זוהה סוג הדוח בקובץ ${f.name}`); continue; }
      const {ym, data} = ({revenue:parseRevenue, hours:parseHours, payroll:parsePayroll})[type](wb, f.name);
      if(!ym){ toast(`לא זוהה החודש בקובץ ${f.name}`); continue; }
      const key = {revenue:'revenue', hours:'hours', payroll:'payroll'}[type];
      const doc = Object.assign({ym}, months[ym]||{}, {[key]:data});
      await store.saveMonth(ym, doc);
      ui.ym = ym;
      toast(`${({revenue:'דוח ההכנסות',hours:'דוח השעות',payroll:'דוח השכר'})[type]} ל${monthName(ym)} נקלט`);
    }catch(err){ console.error(err); toast(`לא הצלחנו לקרוא את ${f.name}: ${err.message||'פורמט לא מוכר'}`); }
  }
  render();
}

/* ---------- ייבוא וייצוא ---------- */
async function importMapping(file){
  const wb = await readWorkbook(file);
  const aoa = Object.values(wb.sheets||{}).find(a=>findHeader(a, r=>r.includes('קבוצת לקוח'))>=0);
  if(!aoa){ toast('לא נמצאה עמודת "קבוצת לקוח" בקובץ'); return; }
  const hi = findHeader(aoa, r=>r.includes('קבוצת לקוח')); const H = aoa[hi].map(normName);
  const iN=H.indexOf('קבוצת לקוח'), iCodes=H.indexOf('קודי אתרים'), iSites=H.findIndex(h=>h.startsWith('אתרים')), iCl=H.findIndex(h=>h.startsWith('לקוחות בהנהלת'));
  const groups=[];
  for(const r of aoa.slice(hi+1)){
    const name = normName(r[iN]); if(!name || /^סה"כ/.test(name)) continue;
    const sites = iCodes>=0 ? String(r[iCodes]??'').split(/[,\s]+/).filter(Boolean) : [...new Set([...String(r[iSites]??'').matchAll(/\((\d+)\)/g)].map(m=>m[1]))];
    const clients = String(r[iCl]??'').split('|').map(normName).filter(Boolean);
    groups.push({id:'g'+(groups.length+1).toString().padStart(3,'0'), name, sites, clients});
  }
  if(!groups.length){ toast('לא נמצאו שורות התאמה בקובץ'); return; }
  mapping.groups = groups; if(!mapping.overheadSites.length) mapping.overheadSites=['999'];
  await store.saveMapping(); render(); toast(`יובאו ${groups.length} לקוחות`);
}
function mappingAoa(){
  const info = {}; Object.values(months).forEach(M=>{ Object.entries(M.hours?.sites||{}).forEach(([c,s])=>info[c]={name:s.name, branch:s.branch}); Object.entries(M.payroll?.sites||{}).forEach(([c,s])=>info[c] ||= {name:s.name, branch:''}); });
  return [['קבוצת לקוח','סניף','קודי אתרים','אתרים בנוכחות ובשכר','לקוחות בהנהלת החשבונות'],
    ...mapping.groups.map(g=>[g.name, [...new Set(g.sites.map(c=>info[c]?.branch).filter(Boolean))].join(' / '), g.sites.join(', '), g.sites.map(c=>`${info[c]?.name||''} (${c})`).join(', '), g.clients.join(' | ')])];
}
async function saveXlsx(wb, filename){
  const data = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  const dl = window.claude?.use ? await window.claude.use('downloads').catch(()=>null) : null;
  if(dl){ try{ await dl.save({filename, data:new Blob([data])}); toast('הקובץ נשמר'); }catch(e){ if(e?.code!=='declined') toast('השמירה לא הושלמה'); } return; }
  try{ XLSX.writeFile(wb, filename); }catch(e){ toast('ההורדה נחסמה בתצוגה הזו'); }
}
function exportReport(){
  if(!ui.ym){ toast('אין נתונים לייצוא'); return; }
  const per = period(), R = computePeriod(per.months), wb = XLSX.utils.book_new(); wb.Workbook = {Views:[{RTL:true}]};
  const r2 = v => isFinite(v) ? Math.round(v*100)/100 : '';
  const cl = [['לקוח','סניף','הכנסות','שעות','עלות מעביד','רווח גולמי','שיעור','הכנסה לשעה','עלות לשעה','סטטוס','שמות בהנהלת החשבונות','אתרים'],
    ...R.groups.sort((a,b)=>b.rev-a.rev).map(g=>[g.name, g.branchList.join(' / '), r2(g.rev), r2(g.h), r2(g.cost), r2(g.gp), r2(g.margin), r2(g.revH), r2(g.costH), g.flags.map(f=>f[1]).join(', '), Object.keys(g.clients).join(' | '), Object.values(g.sites).map(s=>`${s.name} (${s.code})`).join(', ')])];
  const ws = XLSX.utils.aoa_to_sheet(cl); ws['!cols']=[{wch:28},{wch:16},{wch:12},{wch:9},{wch:12},{wch:12},{wch:8},{wch:10},{wch:10},{wch:22},{wch:40},{wch:40}];
  XLSX.utils.book_append_sheet(wb, ws, 'לקוחות');
  const T = R.tot;
  const br = [['סניף','הכנסות','שעות','עלות מעביד','רווח גולמי','שיעור','הכנסה לשעה','עלות לשעה'],
    ...Object.values(R.branches).map(b=>[b.name, r2(b.rev), r2(b.h), r2(b.cost), r2(b.gp), r2(b.margin), r2(b.revH), r2(b.costH)]),
    ['סה"כ אתרים', r2(T.rev), r2(T.h), r2(T.cost), r2(T.gp), r2(T.margin), r2(T.revH), r2(T.costH)], ['שכר הנהלה','','',r2(T.overhead)], ['רווח אחרי שכר הנהלה', r2(T.rev), '', r2(T.cost+T.overhead), r2(T.net), r2(T.netMargin)]];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(br), 'סניפים');
  if(R.parts) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['חודש','הכנסות','שעות','עלות מעביד','רווח גולמי','שיעור','שכר הנהלה','אחרי שכר הנהלה','שיעור'],
    ...R.parts.map(p=>{ const t=p.tot; return [monthName(p.ym), r2(t.rev), r2(t.h), r2(t.cost), r2(t.gp), r2(t.margin), r2(t.overhead), r2(t.net), r2(t.netMargin)]; })]), 'לפי חודש');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(mappingAoa()), 'טבלת התאמה');
  saveXlsx(wb, `רווחיות-לקוחות-${per.key}.xlsx`);
}

/* ---------- גרפים ---------- */
const cv = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
function drawChart(id, cfg, tick, label){
  const el = document.getElementById(id); if(!el || !window.Chart) return;
  cfg.options = {responsive:true, maintainAspectRatio:false, animation:false, interaction:{mode:'index', intersect:false},
    plugins:{legend:{display:false}, tooltip:{rtl:true, textDirection:'rtl', backgroundColor:cv('--ink'), titleColor:cv('--bg'), bodyColor:cv('--bg'), padding:10, boxPadding:4, callbacks:{label}}},
    scales:{x:{grid:{display:false}, border:{color:cv('--line')}, ticks:{color:cv('--ink-2'), font:{family:cv('--body')}}},
            y:{beginAtZero:true, grid:{color:cv('--grid')}, border:{display:false}, ticks:{color:cv('--muted'), font:{family:cv('--body')}, callback:tick, maxTicksLimit:6}}}};
  charts[id] = new Chart(el, cfg);
}

/* ============================================================ אירועים */
document.addEventListener('click', async e=>{
  const t = e.target.closest('button, tr[data-open], tr[data-branch-go], th[data-sort]'); if(!t) return;
  const d = t.dataset;
  if(d.tab){ ui.tab=d.tab; saveUi(); render(); window.scrollTo({top:0}); return; }
  if(d.branchGo){ ui.tab='clients'; ui.branch=d.branchGo; saveUi(); render(); return; }
  if(d.sort){ ui.sort = [d.sort, ui.sort[0]===d.sort && ui.sort[1]==='desc' ? 'asc' : 'desc']; saveUi(); render(); return; }
  if(d.open){ ui.open = ui.open===d.open ? null : d.open; render(); return; }
  if(d.client){ ui.client=d.client; ui.tab='client'; saveUi(); render(); window.scrollTo({top:0}); return; }
  if(t.id==='btn-export') return exportReport();
  if(t.id==='map-export'){ const wb=XLSX.utils.book_new(); wb.Workbook={Views:[{RTL:true}]}; XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(mappingAoa()), 'טבלת התאמה'); return saveXlsx(wb, 'טבלת-התאמת-לקוחות.xlsx'); }
  if(d.unsite){ const [gid,c]=d.unsite.split('|'); const g=mapping.groups.find(x=>x.id===gid); g.sites=g.sites.filter(x=>x!==c); await store.saveMapping(); render(); return; }
  if(d.unclient){ const i=d.unclient.indexOf('|'); const g=mapping.groups.find(x=>x.id===d.unclient.slice(0,i)); const c=d.unclient.slice(i+1); g.clients=g.clients.filter(x=>x!==c); await store.saveMapping(); render(); return; }
  if(d.unoverhead){ mapping.overheadSites = mapping.overheadSites.filter(x=>x!==d.unoverhead); await store.saveMapping(); render(); return; }
  if(d.delmonth){
    if(!t.classList.contains('armed')){ t.classList.add('armed'); t.textContent='לחיצה נוספת תמחק את החודש'; return; }
    await store.deleteMonth(d.delmonth); render(); toast('החודש נמחק'); return;
  }
});
document.addEventListener('change', async e=>{
  const t = e.target, d = t.dataset;
  if(t.id==='f-ym'){ ui.ym=t.value; ui.open=null; saveUi(); render(); }
  else if(t.id==='f-client'){ ui.client=t.value; saveUi(); render(); }
  else if(t.id==='f-cyear'){ const ym = monthList().filter(m=>m.startsWith(t.value)).pop(); if(ym){ ui.ym=ym; saveUi(); render(); } }
  else if(t.id==='f-pmode'){ ui.pmode=t.value; ui.open=null; saveUi(); render(); }
  else if(t.id==='f-branch'){ ui.branch=t.value; saveUi(); render(); }
  else if(t.id==='file-in'){ const f=[...t.files]; t.value=''; await handleFiles(f); }
  else if(t.id==='map-file' && t.files[0]){ const f=t.files[0]; t.value=''; try{ await importMapping(f); }catch(err){ toast('לא הצלחנו לקרוא את קובץ ההתאמה'); } }
  else if(d.assignSite) await assign('site', d.assignSite, t.value);
  else if(d.assignClient) await assign('client', d.assignClient, t.value);
  else if(d.rename){ const g=mapping.groups.find(x=>x.id===d.rename); const n=normName(t.value); if(n && g && n!==g.name){ g.name=n; await store.saveMapping(); toast('השם עודכן'); } }
});
let qT;
document.addEventListener('input', e=>{
  if(e.target.id==='f-q'){ ui.q=e.target.value; clearTimeout(qT); qT=setTimeout(()=>{ const pos=e.target.selectionStart; render(); const q=$('#f-q'); if(q){ q.focus(); q.setSelectionRange(pos,pos); } }, 200); }
});
document.addEventListener('dragover', e=>{ const d=e.target.closest?.('#drop'); if(d){ e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e=>{ const d=e.target.closest?.('#drop'); if(d) d.classList.remove('over'); });
document.addEventListener('drop', e=>{ const d=e.target.closest?.('#drop'); if(d){ e.preventDefault(); d.classList.remove('over'); handleFiles([...e.dataTransfer.files]); } });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', ()=>render());
new MutationObserver(()=>render()).observe(document.documentElement,{attributes:true, attributeFilter:['data-theme']});

/* ============================================================ הפעלה */
(async()=>{
  if(!window.XLSX || !window.Chart){ $('#view').innerHTML = '<div class="panel empty">לא הצלחנו לטעון את רכיבי הקריאה והגרפים. יש לבדוק את החיבור לאינטרנט ולרענן.</div>'; return; }
  await store.init();
  if(!monthList().length && ui.tab!=='match') ui.tab='data';
  render();
})();
</script>
