name: Daily Jobs

on:
  schedule:
    - cron: '0 4 * * *'   # 06:00 Israel time (UTC+2)
  workflow_dispatch:        # Allow manual run from GitHub UI

jobs:

  update-market-prices:
    name: Update Market Prices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scrapers/update-market.js

  aggregate-community:
    name: Aggregate Community Prices
    runs-on: ubuntu-latest
    steps:
      - name: Trigger aggregate function
        run: |
          curl -f -s -X POST \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.NETLIFY_URL }}/.netlify/functions/aggregate-community"

  monthly-summary-email:
    name: Monthly Summary Email (last day of month)
    runs-on: ubuntu-latest
    steps:
      - name: Check if last day of month
        id: check
        run: |
          today=$(date +%d)
          last=$(cal $(date +%m) $(date +%Y) | awk 'NF{f=$NF} END{print f}')
          if [ "$today" = "$last" ]; then echo "is_last=true" >> $GITHUB_OUTPUT; fi
      - name: Trigger monthly summary
        if: steps.check.outputs.is_last == 'true'
        run: |
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.NETLIFY_URL }}/.netlify/functions/monthly-summary"
