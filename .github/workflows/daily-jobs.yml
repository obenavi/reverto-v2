name: Daily Jobs

on:
  schedule:
    - cron: '0 4 * * *'   # 06:00 Israel time (UTC+2)
  workflow_dispatch:
    inputs:
      force_monthly:
        description: 'שלח דוח חודשי עכשיו (ללא בדיקת תאריך)'
        type: boolean
        default: false
      test_email:
        description: 'שלח רק לכתובת מייל זו (ריק = כולם)'
        type: string
        default: ''
      target_month:
        description: 'איזה חודש לסכם (YYYY-MM, ריק = החודש הנוכחי) — לשימוש בשליחה מאוחרת של חודש שפוספס'
        type: string
        default: ''

jobs:

  aggregate-community:
    name: Aggregate Community Prices
    runs-on: ubuntu-latest
    steps:
      - name: Trigger aggregate function
        run: |
          curl -f -s -X POST \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.NETLIFY_URL }}/.netlify/functions/aggregate-community"

  monthly-summary-email:
    name: Monthly Summary Email (last day of month)
    runs-on: ubuntu-latest
    steps:
      - name: Check if last day of month
        id: check
        run: |
          # Robust against cal's output-format quirks (locale/week-start differences
          # silently broke the previous cal|awk parse — it was skipping every month
          # end without erroring). If tomorrow's month differs from today's, today
          # must be the last day of the month.
          today_month=$(date +%m)
          tomorrow_month=$(date -d "+1 day" +%m)
          if [ "$today_month" != "$tomorrow_month" ]; then echo "is_last=true" >> $GITHUB_OUTPUT; fi
      - name: Trigger monthly summary
        if: steps.check.outputs.is_last == 'true' || github.event.inputs.force_monthly == 'true'
        run: |
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"test_email":"${{ github.event.inputs.test_email }}","target_month":"${{ github.event.inputs.target_month }}"}' \
            "${{ secrets.NETLIFY_URL }}/.netlify/functions/monthly-summary"
