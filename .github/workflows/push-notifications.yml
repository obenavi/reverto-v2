name: Push Notifications

on:
  workflow_dispatch:
    # Scheduled push is disabled until VAPID_PUBLIC_KEY + VAPID_PRIVATE_KEY
    # are set in Netlify environment variables.
    # To re-enable, add back:
    #   schedule:
    #     - cron: '0 * * * *'

jobs:
  send-push:
    name: Send scheduled push notifications
    runs-on: ubuntu-latest
    steps:
      - name: Trigger send-push function
        run: |
          curl -f -s -X POST \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.NETLIFY_URL }}/.netlify/functions/send-push"
