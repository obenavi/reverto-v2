name: Marketing Campaigns

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes — dispatches any campaign whose scheduled time has arrived
  workflow_dispatch:

jobs:
  send-scheduled-campaigns:
    name: Send Scheduled Campaigns
    runs-on: ubuntu-latest
    steps:
      - name: Trigger send-scheduled-campaigns function
        run: |
          curl -f -s -X POST \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.NETLIFY_URL }}/.netlify/functions/send-scheduled-campaigns"
